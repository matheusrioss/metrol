<title>Watson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Watson veste um unico mundo visual: gabinete vitoriano a luz de gas.
   Por isso a pagina nao segue o tema do visualizador, e pinta cada cor
   explicitamente para se sustentar sobre qualquer fundo do hospedeiro. */
:root {
  color-scheme: dark;

  --void: #0B0A08;
  --surface: #141210;
  --raised: #1C1916;
  --hover: #24201B;
  --line: #2A2621;
  --line-strong: #3A342C;

  --ink: #EFEBE4;
  --ink-dim: #A09A8F;
  --ink-mute: #6B655C;
  --ink-inverse: #0B0A08;

  --brass: #C8A45C;
  --brass-bright: #E2C489;
  --brass-deep: #8A6E33;
  --brass-faint: rgba(200, 164, 92, 0.12);
  --brass-line: rgba(200, 164, 92, 0.30);

  --good: #5FAF86;
  --good-faint: rgba(95, 175, 134, 0.14);
  --warn: #E0B24A;
  --warn-faint: rgba(224, 178, 74, 0.14);
  --crit: #E2483C;
  --crit-faint: rgba(226, 72, 60, 0.15);

  --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --bar: 74px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Luz de lamparina no alto da pagina, sutil e imovel. */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 340px;
  background: radial-gradient(120% 100% at 50% 0%, rgba(200, 164, 92, 0.09), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app { position: relative; z-index: 1; }

.wrap {
  max-width: 620px;
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 0 calc(var(--bar) + 40px + env(safe-area-inset-bottom, 0px));
}

h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

/* ---------- cabecalho de secao ---------- */
.head { padding-block: 26px 20px; display: flex; align-items: flex-end; gap: 14px; }
.head-text { flex: 1; min-width: 0; }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--brass); margin-bottom: 6px;
}
.head h1 { font-size: 29px; line-height: 1.15; letter-spacing: 0.01em; }

.add {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: var(--brass); color: var(--ink-inverse);
  display: grid; place-items: center; font-size: 22px; line-height: 1;
  transition: transform .12s ease, background .12s ease;
}
.add:hover { background: var(--brass-bright); transform: translateY(-1px); }

/* ---------- superficies ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
}
.card + .card { margin-top: 10px; }
.card.lit { border-color: var(--brass-line); background: var(--raised); }

.section-label {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-dim);
  margin: 26px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.section-label button { color: var(--brass); font-size: 11.5px; font-family: var(--sans); letter-spacing: 0; text-transform: none; }

.rule { height: 1px; background: var(--line); border: 0; margin: 14px 0; }

/* ---------- tipografia utilitaria ---------- */
.dim { color: var(--ink-dim); }
.mute { color: var(--ink-mute); }
.small { font-size: 13px; line-height: 1.45; }
.tiny { font-size: 11.5px; line-height: 1.4; }
.strong { font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- pastilhas de estado ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.01em;
  background: rgba(160, 154, 143, 0.12); color: var(--ink-dim);
}
.pill.good { background: var(--good-faint); color: var(--good); }
.pill.warn { background: var(--warn-faint); color: var(--warn); }
.pill.crit { background: var(--crit-faint); color: var(--crit); }
.pill.brass { background: var(--brass-faint); color: var(--brass); }

/* ---------- botoes e campos ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px 20px; border-radius: 10px;
  background: var(--brass); color: var(--ink-inverse);
  font-weight: 600; letter-spacing: 0.01em;
  transition: background .12s ease, opacity .12s ease;
}
.btn:hover { background: var(--brass-bright); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--brass); border: 1px solid var(--brass-line); }
.btn.ghost:hover { background: var(--brass-faint); }
.btn.bare { background: transparent; color: var(--ink-dim); padding-block: 10px; }
.btn.bare:hover { color: var(--ink); }
.btn.danger { background: var(--crit-faint); color: var(--crit); border: 1px solid transparent; }

.field { display: block; margin-bottom: 14px; }
.field > span {
  display: block; font-size: 11.5px; font-weight: 500;
  color: var(--ink-dim); margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%; background: var(--raised);
  border: 1px solid var(--line-strong); border-radius: 10px;
  padding: 11px 13px; font-size: 15px;
}
.field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-mute); }
.field .hint { font-size: 11.5px; color: var(--ink-mute); margin-top: 5px; display: block; }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.chip {
  padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 12px; color: var(--ink-dim);
  transition: all .12s ease;
}
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--brass-faint); border-color: var(--brass-line); color: var(--brass-bright); }

.err { color: var(--crit); font-size: 13px; margin-top: 8px; }
.ok-note { color: var(--good); font-size: 13px; margin-top: 8px; }

/* ---------- barra inferior ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-around;
  background: rgba(11, 10, 8, 0.94);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 10px 6px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--ink-mute); padding: 2px 0;
}
.bar button svg { width: 21px; height: 21px; }
.bar button span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; }
.bar button[aria-current="true"] { color: var(--brass-bright); }
.bar .home-slot { margin-top: -20px; }
.bar .home-mark {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--brass-faint); border: 1px solid var(--brass-line);
  display: grid; place-items: center; color: var(--brass);
  transition: all .14s ease;
}
.bar button[aria-current="true"] .home-mark { background: var(--brass); border-color: var(--brass-bright); color: var(--ink-inverse); }
.bar .home-slot svg { width: 22px; height: 22px; }

/* ---------- lista de compromissos ---------- */
.entry { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; width: 100%; text-align: left; }
.entry + .entry { border-top: 1px solid var(--line); }
.entry-time { width: 46px; flex: none; padding-top: 1px; }
.entry-time b { font-family: var(--mono); font-size: 13.5px; color: var(--brass); font-weight: 500; }
.entry-time i { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-mute); font-style: normal; }
.entry-track { width: 2px; align-self: stretch; background: var(--line-strong); border-radius: 1px; flex: none; }
.entry-body { flex: 1; min-width: 0; }
.entry-body b { display: block; font-weight: 600; font-size: 14.5px; }
.entry-body p { margin: 2px 0 0; font-size: 12px; color: var(--ink-mute); }
.entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

/* ---------- calendario ---------- */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-nav h2 { font-size: 18px; }
.cal-nav button.step {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--raised); color: var(--ink-dim);
  display: grid; place-items: center;
}
.cal-nav button.step:hover { background: var(--hover); color: var(--ink); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow {
  text-align: center; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.1em; color: var(--ink-mute); padding-bottom: 8px;
}
.cal-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 0; }
.cal-num {
  width: 33px; height: 33px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13.5px;
  font-variant-numeric: tabular-nums;
  transition: background .1s ease;
}
.cal-cell:hover .cal-num { background: var(--hover); }
.cal-num.off { color: var(--ink-mute); opacity: .45; }
.cal-num.today { box-shadow: inset 0 0 0 1px var(--brass-line); color: var(--brass-bright); }
.cal-num.sel { background: var(--brass); color: var(--ink-inverse); font-weight: 600; }
.cal-dots { display: flex; gap: 2px; height: 6px; align-items: center; }
.cal-dot { width: 3.5px; height: 3.5px; border-radius: 50%; background: var(--brass-deep); }
.cal-dot.bday { background: var(--good); }

/* ---------- saude ---------- */
.gauge-row { display: flex; align-items: center; gap: 20px; }
.gauge { position: relative; flex: none; }
.gauge-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0;
}
.gauge-center b { font-family: var(--serif); font-size: 26px; line-height: 1; }
.gauge-center span { font-family: var(--mono); font-size: 8.5px; color: var(--ink-mute); letter-spacing: 0.08em; margin-top: 3px; }
.stat-pair { display: flex; gap: 22px; margin-top: 10px; }
.stat-pair div b { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.1; }
.stat-pair div span { font-family: var(--mono); font-size: 9.5px; color: var(--ink-mute); letter-spacing: 0.05em; }

.metric { display: flex; align-items: baseline; gap: 8px; }
.metric b { font-family: var(--serif); font-size: 25px; line-height: 1.1; }
.metric u { text-decoration: none; font-size: 12px; color: var(--ink-mute); }
.metric .delta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); background: var(--raised); padding: 2px 6px; border-radius: 5px; }

.alert { display: flex; gap: 11px; align-items: flex-start; }
.alert .glyph { flex: none; margin-top: 1px; }
.alert b { display: block; font-size: 14.5px; font-weight: 600; }
.alert p { margin: 4px 0 0; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }

/* ---------- dossies ---------- */
.search {
  display: flex; align-items: center; gap: 9px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 13px; margin-bottom: 14px;
}
.search input { flex: 1; background: none; border: none; padding: 0; font-size: 14.5px; }
.search input:focus { outline: none; }
.dossier h3 { font-size: 16.5px; line-height: 1.3; margin: 7px 0 6px; }
.dossier p { margin: 0; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.dossier .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.topics { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.topic { background: var(--raised); padding: 3px 8px; border-radius: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }

/* ---------- conversa ---------- */
.chat-log { display: flex; flex-direction: column; gap: 12px; }
.turn { display: flex; gap: 9px; align-items: flex-end; }
.turn.mine { justify-content: flex-end; }
.avatar {
  width: 25px; height: 25px; border-radius: 50%; flex: none;
  background: var(--brass-faint); display: grid; place-items: center;
  color: var(--brass); margin-bottom: 2px;
}
.bubble { max-width: 84%; padding: 11px 13px; border-radius: 13px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
.turn.theirs .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.turn.mine .bubble { background: var(--brass-faint); border-bottom-right-radius: 5px; }
.bubble .src { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--ink-mute); margin-top: 8px; }

.composer {
  display: flex; gap: 8px; align-items: flex-end;
  border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px;
}
.composer textarea {
  flex: 1; background: var(--raised); border: 1px solid var(--line-strong);
  border-radius: 12px; padding: 11px 13px; min-height: 44px; max-height: 130px;
  resize: none; font-size: 14.5px; line-height: 1.45;
}
.composer button {
  width: 42px; height: 42px; flex: none; border-radius: 50%;
  background: var(--brass); color: var(--ink-inverse); display: grid; place-items: center;
}
.composer button[disabled] { opacity: .35; }

.suggest { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.suggest button {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 99px; padding: 10px 16px; font-size: 13px; color: var(--ink-dim);
}
.suggest button:hover { border-color: var(--brass-line); color: var(--ink); }

/* ---------- vazio ---------- */
.empty { text-align: center; padding: 34px 20px; }
.empty .mark {
  width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 14px;
  background: var(--brass-faint); display: grid; place-items: center; color: var(--brass-deep);
}
.empty h3 { font-size: 17px; margin-bottom: 7px; }
.empty p { margin: 0 auto; max-width: 330px; font-size: 13px; color: var(--ink-mute); line-height: 1.55; }

/* ---------- painel deslizante ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(5, 5, 4, 0.78);
  display: flex; align-items: flex-end; justify-content: center;
}
.panel {
  width: 100%; max-width: 620px; max-height: 92%;
  background: var(--surface);
  border: 1px solid var(--brass-line); border-bottom: none;
  border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column;
  animation: rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise { from { transform: translateY(26px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.panel-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 11px auto 0; flex: none; }
.panel-head { display: flex; gap: 12px; align-items: flex-start; padding: 15px 20px 10px; flex: none; }
.panel-head h2 { font-size: 21px; line-height: 1.2; flex: 1; }
.panel-head p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-mute); line-height: 1.45; }
.panel-close {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: var(--raised); color: var(--ink-dim); display: grid; place-items: center;
}
.panel-body { overflow-y: auto; padding: 6px 20px 18px; flex: 1; }
.panel-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; flex: none; }

/* ---------- avisos ---------- */
.banner {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--brass-faint); border-radius: 10px; padding: 12px 13px;
  font-size: 12.5px; color: var(--ink-dim); line-height: 1.5;
}
.banner.warn { background: var(--warn-faint); }
.banner svg { flex: none; margin-top: 1px; }

.demo-flag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--warn); background: var(--warn-faint);
  padding: 4px 9px; border-radius: 5px; text-transform: uppercase;
}

.spin { width: 15px; height: 15px; border: 2px solid var(--brass-line); border-top-color: var(--brass); border-radius: 50%; animation: turn .7s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.thinking { display: flex; align-items: center; gap: 9px; color: var(--ink-mute); font-size: 12.5px; padding: 4px 0; }

@media (max-width: 380px) {
  .head h1 { font-size: 25px; }
  .gauge-row { gap: 14px; }
}
</style>
<div id="app">
  <main class="wrap" id="view"></main>
</div>
<nav class="bar" id="bar"></nav>
<div id="panel-host"></div>

<script>
"use strict";

/* =====================================================================
   Watson — assistente pessoal e corporativo.
   Os dados vivem no banco do artefato, na conta de quem publica. A
   pagina abre imediatamente e liga as funcionalidades conforme as
   capacidades respondem; nada aqui depende de elas existirem.
   ===================================================================== */

const MESES = ["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESES_CURTO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAS = ["domingo","segunda-feira","terca-feira","quarta-feira","quinta-feira","sexta-feira","sabado"];
const DOW = ["D","S","T","Q","Q","S","S"];

const EMPRESAS = [
  { id: "industria", curto: "Industria", longo: "Industria de sinalizacao de pista" },
  { id: "engenharia", curto: "Engenharia", longo: "Engenharia aeroportuaria" },
  { id: "administracao", curto: "Administracao", longo: "Administracao de aeroportos" },
  { id: "software", curto: "Software", longo: "Tecnologia de gestao aeroportuaria" },
  { id: "grupo", curto: "Grupo", longo: "Holding e assuntos transversais" },
  { id: "externo", curto: "Externo", longo: "Parceiros, clientes e fornecedores" },
];
const empresaCurto = (id) => (EMPRESAS.find((e) => e.id === id) || EMPRESAS[4]).curto;

const CATEGORIAS = [
  { id: "reuniao", rotulo: "Reuniao" },
  { id: "medico", rotulo: "Medico" },
  { id: "viagem", rotulo: "Viagem" },
  { id: "compromisso", rotulo: "Compromisso" },
  { id: "pessoal", rotulo: "Pessoal" },
];

const LEMBRETES = [
  { m: 10080, r: "1 semana antes" }, { m: 4320, r: "3 dias antes" },
  { m: 2880, r: "2 dias antes" }, { m: 1440, r: "1 dia antes" },
  { m: 180, r: "3 horas antes" }, { m: 120, r: "2 horas antes" },
  { m: 60, r: "1 hora antes" }, { m: 30, r: "30 minutos antes" },
  { m: 10, r: "10 minutos antes" }, { m: 5, r: "5 minutos antes" },
  { m: 0, r: "Na hora do evento" },
];

const RECORRENCIAS = [
  { id: "unico", rotulo: "Evento unico" }, { id: "diario", rotulo: "Todos os dias" },
  { id: "semanal", rotulo: "Toda semana" }, { id: "quinzenal", rotulo: "A cada 15 dias" },
  { id: "mensal", rotulo: "Todo mes" }, { id: "anual", rotulo: "Todo ano" },
];

const METRICAS = {
  recuperacao: { rotulo: "Recuperacao", unidade: "%", dec: 0 },
  vfc: { rotulo: "Variabilidade cardiaca", unidade: "ms", dec: 0 },
  fcRepouso: { rotulo: "Frequencia em repouso", unidade: "bpm", dec: 0 },
  sono: { rotulo: "Horas de sono", unidade: "h", dec: 1 },
  desempenhoSono: { rotulo: "Desempenho do sono", unidade: "%", dec: 0 },
  esforco: { rotulo: "Esforco diario", unidade: "", dec: 1 },
  calorias: { rotulo: "Calorias", unidade: "kcal", dec: 0 },
  respiracao: { rotulo: "Frequencia respiratoria", unidade: "rpm", dec: 1 },
  oxigenacao: { rotulo: "Oxigenacao", unidade: "%", dec: 0 },
  temperatura: { rotulo: "Temperatura da pele", unidade: "C", dec: 1 },
};
const METRICAS_PRINCIPAIS = ["recuperacao", "vfc", "fcRepouso", "sono", "desempenhoSono", "esforco"];

/* ---------- datas ---------- */
const pad = (n) => String(n).padStart(2, "0");
const chaveDia = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const doDia = (iso) => { const [a, m, d] = iso.split("-").map(Number); return new Date(a, (m || 1) - 1, d || 1); };
const hojeISO = () => chaveDia(new Date());
const somaDias = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
const inicioDia = (d) => { const c = new Date(d); c.setHours(0, 0, 0, 0); return c; };
const distDias = (a, b) => Math.round((inicioDia(b) - inicioDia(a)) / 86400000);
const mesmoDia = (a, b) => chaveDia(a) === chaveDia(b);
const hora = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dataLonga = (d) => `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
const dataCurta = (d) => `${d.getDate()} ${MESES_CURTO[d.getMonth()]}`;
const mesAno = (d) => { const m = MESES[d.getMonth()]; return m[0].toUpperCase() + m.slice(1) + " de " + d.getFullYear(); };
const diaCompleto = (d) => { const x = DIAS[d.getDay()]; return x[0].toUpperCase() + x.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()]; };

function distanciaTexto(alvo, base = new Date()) {
  const n = distDias(base, alvo);
  if (n === 0) return "hoje";
  if (n === 1) return "amanha";
  if (n === -1) return "ontem";
  if (n > 1 && n < 30) return `em ${n} dias`;
  if (n < -1 && n > -30) return `ha ${Math.abs(n)} dias`;
  if (n >= 30) return `em ${Math.round(n / 30)} meses`;
  return `ha ${Math.round(Math.abs(n) / 30)} meses`;
}

function gradeMes(ref) {
  const primeiro = new Date(ref.getFullYear(), ref.getMonth(), 1);
  const cursor = somaDias(primeiro, -primeiro.getDay());
  const semanas = [];
  for (let s = 0; s < 6; s += 1) {
    const semana = [];
    for (let d = 0; d < 7; d += 1) semana.push(somaDias(cursor, s * 7 + d));
    semanas.push(semana);
  }
  return semanas;
}

function proximoAniversario(mes, dia, base = new Date()) {
  let alvo = new Date(base.getFullYear(), mes - 1, dia);
  if (distDias(base, alvo) < 0) alvo = new Date(base.getFullYear() + 1, mes - 1, dia);
  return alvo;
}

/* ---------- recorrencia ----------
   Portado do aplicativo, onde a logica passou por testes que cobrem
   dia 31 em mes de 30, limite de repeticao e janelas parciais. */
function somaMesesMantendoDia(base, meses) {
  const alvo = new Date(base);
  const dia = base.getDate();
  alvo.setDate(1);
  alvo.setMonth(alvo.getMonth() + meses);
  const ultimo = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
  alvo.setDate(Math.min(dia, ultimo));
  return alvo;
}

function expandir(evento, de, ate) {
  const primeiro = new Date(evento.inicio);
  if (Number.isNaN(primeiro.getTime())) return [];

  const duracao = evento.fim ? Math.max(0, new Date(evento.fim) - primeiro) : 0;
  const limite = evento.ate ? doDia(evento.ate) : null;
  const abre = inicioDia(de);
  const fecha = new Date(ate); fecha.setHours(23, 59, 59, 999);

  const montar = (inicio, repetido) => ({
    evento,
    inicio,
    fim: evento.fim ? new Date(inicio.getTime() + duracao) : null,
    chave: chaveDia(inicio),
    repetido,
  });

  if (!evento.recorrencia || evento.recorrencia === "unico") {
    return primeiro >= abre && primeiro <= fecha ? [montar(primeiro, false)] : [];
  }

  const saida = [];
  let cursor = new Date(primeiro);
  let i = 0;
  while (i < 800) {
    if (cursor > fecha) break;
    if (limite && inicioDia(cursor) > inicioDia(limite)) break;
    if (cursor >= abre) saida.push(montar(new Date(cursor), i > 0));
    i += 1;
    if (evento.recorrencia === "diario") cursor = somaDias(primeiro, i);
    else if (evento.recorrencia === "semanal") cursor = somaDias(primeiro, i * 7);
    else if (evento.recorrencia === "quinzenal") cursor = somaDias(primeiro, i * 14);
    else if (evento.recorrencia === "mensal") cursor = somaMesesMantendoDia(primeiro, i);
    else if (evento.recorrencia === "anual") cursor = somaMesesMantendoDia(primeiro, i * 12);
    else break;
  }
  return saida;
}

function ocorrenciasEntre(eventos, de, ate) {
  const saida = [];
  for (const e of eventos) saida.push(...expandir(e, de, ate));
  return saida.sort((a, b) => a.inicio - b.inicio);
}

/* ---------- analise de saude ---------- */
const ehNum = (v) => typeof v === "number" && !Number.isNaN(v);
const media = (v) => (v.length ? v.reduce((a, b) => a + b, 0) / v.length : null);
const serie = (dias, campo) => dias.map((d) => d[campo]).filter(ehNum);

function faixaRecuperacao(v) {
  if (!ehNum(v)) return { tom: "", rotulo: "sem dado" };
  if (v < 34) return { tom: "crit", rotulo: "baixa" };
  if (v < 67) return { tom: "warn", rotulo: "moderada" };
  return { tom: "good", rotulo: "boa" };
}

/* Limites nas faixas do proprio Whoop: abaixo de 34% e zona vermelha,
   entre 34% e 66% amarela. Sao sinais para investigar, nunca diagnostico. */
function avaliarSaude(dias) {
  const out = [];
  if (!dias.length) return out;

  const ord = [...dias].sort((a, b) => a.data.localeCompare(b.data));
  const ultimo = ord[ord.length - 1];
  const tres = ord.slice(-3);
  const sete = ord.slice(-7);
  const base14 = ord.slice(-14, -1);

  if (ehNum(ultimo.recuperacao) && ultimo.recuperacao < 34) {
    out.push({ tom: "crit", titulo: `Recuperacao em ${Math.round(ultimo.recuperacao)}%`,
      texto: "Seu corpo esta na zona vermelha. Vale reduzir o esforco de hoje, adiar decisoes pesadas e priorizar sono." });
  }

  const r3 = serie(tres, "recuperacao");
  if (r3.length >= 3 && r3.every((v) => v < 50)) {
    out.push({ tom: "warn", titulo: "Tres dias seguidos abaixo de 50% de recuperacao",
      texto: "Nao e um dia ruim isolado, e uma tendencia. Carga acumulada, sono curto ou estresse prolongado costumam explicar esse padrao." });
  }

  const s2 = serie(ord.slice(-2), "sono");
  if (s2.length >= 2 && s2.every((v) => v < 6)) {
    out.push({ tom: "warn", titulo: "Duas noites seguidas com menos de 6 horas",
      texto: "O debito de sono se acumula e derruba a recuperacao dos proximos dias. Proteja a agenda da noite." });
  }

  const vfcAgora = media(serie(tres, "vfc"));
  const vfcBase = media(serie(base14, "vfc"));
  if (vfcAgora !== null && vfcBase !== null && vfcBase > 0) {
    const queda = ((vfcAgora - vfcBase) / vfcBase) * 100;
    if (queda <= -15) {
      out.push({ tom: "warn", titulo: `Variabilidade cardiaca ${Math.abs(Math.round(queda))}% abaixo do seu normal`,
        texto: "Queda sustentada da VFC costuma anteceder cansaco, infeccao ou excesso de estresse. Observe os proximos dias." });
    }
  }

  const fcAgora = media(serie(tres, "fcRepouso"));
  const fcBase = media(serie(base14, "fcRepouso"));
  if (fcAgora !== null && fcBase !== null && fcBase > 0) {
    const alta = ((fcAgora - fcBase) / fcBase) * 100;
    if (alta >= 8) {
      out.push({ tom: "warn", titulo: `Frequencia em repouso ${Math.round(alta)}% acima do habitual`,
        texto: "Elevacao da frequencia de repouso aparece antes de gripes, apos alcool e em noites mal dormidas." });
    }
  }

  if (ehNum(ultimo.esforco) && ehNum(ultimo.recuperacao) && ultimo.esforco > 14 && ultimo.recuperacao < 45) {
    out.push({ tom: "warn", titulo: "Esforco alto com recuperacao baixa",
      texto: `Voce registrou esforco ${ultimo.esforco.toFixed(1)} com apenas ${Math.round(ultimo.recuperacao)}% de recuperacao. Repetir esse padrao leva a exaustao.` });
  }

  const respAgora = media(serie(tres, "respiracao"));
  const respBase = media(serie(base14, "respiracao"));
  if (respAgora !== null && respBase !== null && respAgora - respBase >= 1.5) {
    out.push({ tom: "warn", titulo: "Frequencia respiratoria acima da sua linha de base",
      texto: "O Whoop trata esse sinal como um dos primeiros indicios de doenca respiratoria. Vale ficar atento." });
  }

  if (!out.length) {
    const r7 = media(serie(sete, "recuperacao"));
    if (r7 !== null && r7 >= 66) {
      out.push({ tom: "good", titulo: `Semana solida, ${Math.round(r7)}% de recuperacao media`,
        texto: "Corpo respondendo bem a carga atual. E uma boa janela para as semanas mais exigentes de agenda." });
    }
  }
  return out;
}

function cargaPorDia(ocorrencias) {
  const mapa = new Map();
  for (const oc of ocorrencias) {
    const cat = oc.evento.categoria;
    if (cat !== "reuniao" && cat !== "compromisso") continue;
    const atual = mapa.get(oc.chave) || { data: oc.chave, reunioes: 0, horas: 0 };
    atual.reunioes += 1;
    atual.horas += oc.fim ? (oc.fim - oc.inicio) / 3600000 : 1;
    mapa.set(oc.chave, atual);
  }
  return mapa;
}

/* Custo fisiologico estimado de cada reuniao recorrente: a recuperacao do
   dia seguinte a cada ocorrencia contra a media geral do periodo. Indicio,
   nunca prova de causa. */
function impactoReunioes(ocorrencias, dias, minimo = 2) {
  const porData = new Map(dias.map((d) => [d.data, d]));
  const geral = media(serie(dias, "recuperacao"));
  if (geral === null) return [];

  const grupos = new Map();
  for (const oc of ocorrencias) {
    const cat = oc.evento.categoria;
    if (cat !== "reuniao" && cat !== "compromisso") continue;
    const lista = grupos.get(oc.evento.id) || [];
    lista.push(oc);
    grupos.set(oc.evento.id, lista);
  }

  const saida = [];
  for (const [id, lista] of grupos) {
    const recs = [];
    for (const oc of lista) {
      const seguinte = porData.get(chaveDia(somaDias(doDia(oc.chave), 1)));
      if (seguinte && ehNum(seguinte.recuperacao)) recs.push(seguinte.recuperacao);
    }
    if (recs.length < minimo) continue;
    const m = media(recs);
    saida.push({ id, titulo: lista[0].evento.titulo, ocorrencias: recs.length, recuperacaoSeguinte: m, delta: m - geral });
  }
  return saida.sort((a, b) => a.delta - b.delta);
}

/* Dias cheios contra dias leves, divididos por tercos. A divisao pela
   mediana colapsava quando muitos dias tinham carga identica, que e o
   normal de uma agenda executiva. */
function correlacaoCarga(ocorrencias, dias) {
  const carga = cargaPorDia(ocorrencias);
  if (carga.size < 4) return null;

  const porData = new Map(dias.map((d) => [d.data, d]));
  const comRec = [...carga.values()]
    .map((item) => {
      const seguinte = porData.get(chaveDia(somaDias(doDia(item.data), 1)));
      return seguinte && ehNum(seguinte.recuperacao) ? { horas: item.horas, rec: seguinte.recuperacao } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.horas - b.horas);

  if (comRec.length < 4) return null;

  const tam = Math.max(2, Math.floor(comRec.length / 3));
  const leve = comRec.slice(0, tam);
  const pesado = comRec.slice(-tam);
  if (pesado[0].horas <= leve[leve.length - 1].horas) return null;

  return {
    dias: leve.length + pesado.length,
    leve: media(leve.map((d) => d.rec)),
    pesado: media(pesado.map((d) => d.rec)),
    limiar: pesado[0].horas,
  };
}

function resumirMetrica(campo, periodo, anterior = []) {
  const v = serie(periodo, campo);
  const p = serie(anterior, campo);
  const m = media(v);
  const ma = media(p);
  return {
    campo, amostras: v.length, media: m,
    minimo: v.length ? Math.min(...v) : null,
    maximo: v.length ? Math.max(...v) : null,
    variacao: m !== null && ma !== null && ma !== 0 ? ((m - ma) / ma) * 100 : null,
  };
}

    { id: "demo2", titulo: "Homologacao de balizamento", descricao: "Ensaio fotometrico da nova linha de luminarias de pista", categoria: "reuniao", empresa: "industria", local: "Fabrica", inicio: em(0, 14, 30), fim: em(0, 16, 0), recorrencia: "unico", lembretes: [30], demo: true },
    { id: "demo3", titulo: "Visita tecnica ao patio", categoria: "viagem", empresa: "engenharia", inicio: em(1, 8, 0), fim: em(1, 12, 0), recorrencia: "unico", lembretes: [1440], demo: true },
  ];
  S.aniversarios = [
    { id: "demoa1", nome: "Socio fundador", dia: somaDias(hoje, 3).getDate(), mes: somaDias(hoje, 3).getMonth() + 1, ano: 1968, relacao: "Sociedade", lembretes: [10080, 1440], demo: true },
  ];
  S.saude = [];
  for (let i = 13; i >= 0; i -= 1) {
    const d = somaDias(hoje, -i);
    const onda = Math.sin(i / 2.4);
    S.saude.push({
      id: chaveDia(d), data: chaveDia(d), demo: true,
      recuperacao: Math.round(58 + onda * 22),
      vfc: Math.round(46 + onda * 9),
      fcRepouso: Math.round(56 - onda * 4),
      sono: Number((6.9 + onda * 0.9).toFixed(1)),
      desempenhoSono: Math.round(82 + onda * 10),
      esforco: Number((11.5 + Math.abs(onda) * 4).toFixed(1)),
    });
  }
  S.dossies = [
    { id: "demod1", titulo: "Licitacao de balizamento em Confins", empresa: "industria", data: chaveDia(somaDias(hoje, -6)),
      participantes: ["Diretoria comercial", "Engenharia de produto"], temas: ["licitacao", "balizamento", "prazo"],
      resumo: "Analise do edital de balizamento noturno e da capacidade atual da fabrica para atender o volume no prazo do certame.",
      decisoes: "Aprovado participar do certame com proposta propria.",
      acoes: "Engenharia fecha o custo unitario ate o fim da semana.", demo: true },
    { id: "demod2", titulo: "Roadmap do modulo de faturamento", empresa: "software", data: chaveDia(somaDias(hoje, -11)),
      participantes: ["Produto", "Operacoes aeroportuarias"], temas: ["roadmap", "integracao", "faturamento"],
      resumo: "Integracao do modulo de faturamento com os dados de movimentacao da torre, e o impacto na cobranca por aeronave.",
      decisoes: "Integracao entra na proxima versao.", demo: true },
  ];
}

function limparDemonstracao() {
  if (!S.demonstracao) return;
  S.demonstracao = false;
  S.eventos = S.eventos.filter((x) => !x.demo);
  S.aniversarios = S.aniversarios.filter((x) => !x.demo);
  S.saude = S.saude.filter((x) => !x.demo);
  S.dossies = S.dossies.filter((x) => !x.demo);
}

/* ---------- consultas derivadas ---------- */
function aniversariosProximos(limite) {
  const hoje = new Date();
  const lista = S.aniversarios.map((b) => {
    const prox = proximoAniversario(b.mes, b.dia, hoje);
    return { b, prox, faltam: distDias(hoje, prox), idade: b.ano ? prox.getFullYear() - b.ano : null };
  }).sort((a, b) => a.faltam - b.faltam);
  return typeof limite === "number" ? lista.slice(0, limite) : lista;
}

function saudeEntre(deISO, ateISO) {
  return S.saude.filter((d) => d.data >= deISO && d.data <= ateISO);
}

/* Busca textual simples sobre os dossies: sem acento, por prefixo, e
   com todos os termos antes de relaxar para qualquer um deles. */
const semAcento = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function buscarDossies(consulta) {
  const termos = semAcento(consulta).split(/\s+/).filter((t) => t.length >= 3);
  if (!termos.length) return S.dossies;
  const campos = (d) => semAcento([d.titulo, d.resumo, d.decisoes, d.acoes, (d.participantes || []).join(" "), (d.temas || []).join(" "), empresaCurto(d.empresa)].join(" "));
  const todos = S.dossies.filter((d) => { const t = campos(d); return termos.every((x) => t.includes(x)); });
  if (todos.length) return todos;
  return S.dossies.filter((d) => { const t = campos(d); return termos.some((x) => t.includes(x)); });
}
</script>
<script>
"use strict";

/* ---------- graficos ----------
   Uma serie por grafico, entao nenhum precisa de legenda: o rotulo acima
   ja nomeia o que a linha mostra. O ultimo ponto fica marcado porque e o
   valor que interessa agora. */
function sparkline(valores, cor = "var(--brass)", altura = 46) {
  const pontos = valores.filter((v) => ehNum(v));
  if (pontos.length < 2) return `<div style="height:${altura}px"></div>`;
  const L = 300, P = 5;
  const min = Math.min(...pontos), max = Math.max(...pontos);
  const amp = max - min || 1;
  const passo = (L - P * 2) / (pontos.length - 1);
  const xy = pontos.map((v, i) => [P + i * passo, P + (1 - (v - min) / amp) * (altura - P * 2)]);
  const linha = xy.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const area = `${linha} L${xy[xy.length - 1][0].toFixed(1)},${altura} L${xy[0][0].toFixed(1)},${altura} Z`;
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const ult = xy[xy.length - 1];
  return `<svg viewBox="0 0 ${L} ${altura}" width="100%" height="${altura}" preserveAspectRatio="none" role="img" aria-label="tendencia do periodo">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${cor}" stop-opacity="0.24"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${linha}" fill="none" stroke="${cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${ult[0].toFixed(1)}" cy="${ult[1].toFixed(1)}" r="3.4" fill="${cor}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

/* Barras com folga entre si, extremidade arredondada e coluna apagada
   onde nao ha registro: um dia sem dado nao pode parecer um dia ruim. */
function barras(itens, teto = 100, altura = 76) {
  if (!itens.length) return "";
  const L = 320, vao = L / itens.length;
  // Folga generosa entre colunas: no teste visual, barras coladas liam
  // como blocos e escondiam a variacao do periodo.
  const larg = Math.max(3, Math.min(vao * 0.52, 14));
  const marcas = itens.map((it, i) => {
    const x = i * vao + (vao - larg) / 2;
    if (!ehNum(it.v)) return `<rect x="${x.toFixed(1)}" y="${altura - 3}" width="${larg.toFixed(1)}" height="3" rx="1.5" fill="var(--line)"/>`;
    const h = Math.max(3, (Math.min(it.v, teto) / teto) * altura);
    const cor = it.cor || "var(--brass)";
    return `<rect x="${x.toFixed(1)}" y="${(altura - h).toFixed(1)}" width="${larg.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, larg / 2).toFixed(1)}" fill="${cor}"/>`;
  }).join("");
  const rotulos = itens.map((it) => `<span style="flex:1;text-align:center">${esc(it.r || "")}</span>`).join("");
  return `<svg viewBox="0 0 ${L} ${altura}" width="100%" height="${altura}" preserveAspectRatio="none" role="img" aria-label="valores diarios do periodo">${marcas}</svg>
    <div style="display:flex;font-family:var(--mono);font-size:9px;color:var(--ink-mute);margin-top:5px">${rotulos}</div>`;
}

function medidor(valor, cor, rotulo, tam = 96) {
  const esp = 7, raio = (tam - esp) / 2, circ = 2 * Math.PI * raio;
  const p = ehNum(valor) ? Math.max(0, Math.min(100, valor)) / 100 : 0;
  return `<div class="gauge" style="width:${tam}px;height:${tam}px">
    <svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" role="img" aria-label="${esc(rotulo)} ${ehNum(valor) ? Math.round(valor) + " por cento" : "sem dado"}">
      <circle cx="${tam / 2}" cy="${tam / 2}" r="${raio}" fill="none" stroke="var(--line)" stroke-width="${esp}"/>
      <circle cx="${tam / 2}" cy="${tam / 2}" r="${raio}" fill="none" stroke="${cor}" stroke-width="${esp}" stroke-linecap="round"
        stroke-dasharray="${(circ * p).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${tam / 2} ${tam / 2})"/>
    </svg>
    <div class="gauge-center"><b>${ehNum(valor) ? Math.round(valor) : "--"}</b><span>${esc(rotulo)}</span></div>
  </div>`;
}

function etiquetaDemo() {
  return S.demonstracao ? `<div class="demo-flag">${ICO.info} exemplo</div>` : "";
}

function linhaCompromisso(oc) {
  const e = oc.evento;
  const detalhe = [e.empresa ? empresaCurto(e.empresa) : null, e.local, e.descricao].filter(Boolean).join(" · ");
  return `<button class="entry" data-abrir-evento="${esc(e.id)}">
    <div class="entry-time"><b>${e.diaInteiro ? "dia" : hora(oc.inicio)}</b>${oc.fim && !e.diaInteiro ? `<i>${hora(oc.fim)}</i>` : ""}</div>
    <div class="entry-track"></div>
    <div class="entry-body"><b>${esc(e.titulo)}</b>${detalhe ? `<p>${esc(detalhe)}</p>` : ""}</div>
  </button>`;
}

/* ===================== WATSON (inicio) ===================== */
function viewWatson() {
  const agora = new Date();
  const h = agora.getHours();
  const saudacao = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";

  const ocs = ocorrenciasEntre(S.eventos, agora, somaDias(agora, 1));
  const hoje = ocs.filter((o) => o.chave === chaveDia(agora));
  const amanha = ocs.filter((o) => o.chave === chaveDia(somaDias(agora, 1)));
  const anivs = aniversariosProximos(5).filter((a) => a.faltam <= 45);

  const recentes = S.saude.slice(-21);
  const ultimo = recentes.length ? recentes[recentes.length - 1] : null;
  const ehDeHoje = ultimo && ultimo.data === chaveDia(agora);
  const faixa = faixaRecuperacao(ultimo && ultimo.recuperacao);
  const alertas = avaliarSaude(recentes);

  const horasHoje = hoje
    .filter((o) => o.evento.categoria === "reuniao" || o.evento.categoria === "compromisso")
    .reduce((a, o) => a + (o.fim ? (o.fim - o.inicio) / 3600000 : 1), 0);

  const ocs90 = ocorrenciasEntre(S.eventos, somaDias(agora, -90), agora);
  const corr = correlacaoCarga(ocs90, S.saude);

  return `
  <div class="head">
    <div class="head-text">
      <div class="eyebrow">${esc(diaCompleto(agora))}</div>
      <h1>${saudacao}.</h1>
    </div>
    ${etiquetaDemo()}
  </div>

  ${S.aviso ? `<div class="banner warn">${ICO.alert}<span>${esc(S.aviso)}</span></div><div style="height:12px"></div>` : ""}

  ${S.demonstracao ? `<div class="banner">${ICO.info}<span>Estes sao dados de exemplo, para voce ver como o Watson fica em uso. Assim que registrar seu primeiro evento, relatorio ou dossie, eles desaparecem para sempre.</span></div><div style="height:14px"></div>` : ""}

  <div class="card lit">
    <div style="display:flex;gap:11px;align-items:flex-start">
      <div class="avatar" style="width:31px;height:31px;border:1px solid var(--brass-line)">${ICO.glass}</div>
      <div style="flex:1;min-width:0">
        <h2 style="font-size:17px">Falar com o Watson</h2>
        <p class="tiny mute" style="margin:3px 0 0">${S.dossies.length ? `${S.dossies.length} ${S.dossies.length > 1 ? "dossies" : "dossie"} na base, ${S.saude.length} dias de saude e sua agenda.` : "A base ainda esta vazia. Comece por um resumo de reuniao."}</p>
      </div>
    </div>
    <div style="height:14px"></div>
    <button id="abrir-conversa" style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--void);border:1px solid var(--line-strong);border-radius:10px;padding:7px 7px 7px 14px">
      <span class="dim" style="font-size:14.5px">Pergunte qualquer coisa...</span>
      <span style="width:32px;height:32px;border-radius:50%;background:var(--brass);color:var(--ink-inverse);display:grid;place-items:center">${ICO.up}</span>
    </button>
  </div>

  ${alertas.length ? `
    <div class="section-label"><span>Sinais do seu corpo</span></div>
    ${alertas.slice(0, 3).map((a) => `
      <div class="card alert">
        <span class="glyph" style="color:var(--${a.tom === "crit" ? "crit" : a.tom === "warn" ? "warn" : "good"})">${a.tom === "good" ? ICO.check : ICO.alert}</span>
        <div><b>${esc(a.titulo)}</b><p>${esc(a.texto)}</p></div>
      </div>`).join("")}
  ` : ""}

  <div class="section-label"><span>Sua saude</span><button data-ir="saude">Ver tudo</button></div>
  ${ultimo ? `
    <div class="card">
      <div class="gauge-row">
        ${medidor(ultimo.recuperacao, `var(--${faixa.tom || "brass"})`, "recuperacao")}
        <div style="flex:1;min-width:0">
          <span class="pill ${faixa.tom}">Recuperacao ${esc(faixa.rotulo)}</span>
          <div class="stat-pair">
            <div><b class="num">${ehNum(ultimo.sono) ? ultimo.sono.toFixed(1) : "--"}</b><span>HORAS DE SONO</span></div>
            <div><b class="num">${ehNum(ultimo.esforco) ? ultimo.esforco.toFixed(1) : "--"}</b><span>ESFORCO</span></div>
            <div><b class="num">${ehNum(ultimo.vfc) ? Math.round(ultimo.vfc) : "--"}</b><span>VFC MS</span></div>
          </div>
        </div>
      </div>
      ${recentes.length > 2 ? `<div style="margin-top:16px"><div class="tiny mute" style="margin-bottom:6px">Recuperacao nos ultimos ${recentes.length} dias</div>${sparkline(recentes.map((d) => d.recuperacao), `var(--${faixa.tom || "brass"})`)}</div>` : ""}
      ${!ehDeHoje ? `<p class="tiny" style="color:var(--warn);margin:12px 0 0">Ultimo registro de ${esc(ultimo.data)}. Lance o relatorio de hoje na aba Saude.</p>` : ""}
    </div>
  ` : `
    <div class="card"><div style="display:flex;gap:12px;align-items:center">
      <span class="mute">${ICO.pulse}</span>

    </div></div>
  `}

  <div class="section-label"><span>Hoje${hoje.length ? ` · ${hoje.length} ${hoje.length > 1 ? "compromissos" : "compromisso"}` : ""}</span><button data-ir="agenda">Agenda</button></div>
  <div class="card">
    ${hoje.length ? hoje.map(linhaCompromisso).join("") : `<p class="small mute" style="margin:0">Nenhum compromisso hoje. Aproveite o silencio.</p>`}
    ${horasHoje > 0 ? `<hr class="rule"><p class="tiny mute" style="margin:0">${horasHoje.toFixed(1)} horas em reuniao hoje.${corr && horasHoje > corr.limiar ? ` Em dias assim sua recuperacao no dia seguinte fica em torno de ${Math.round(corr.pesado)}%, contra ${Math.round(corr.leve)}% nos dias leves.` : ""}</p>` : ""}

  ${amanha.length ? `
    <div class="section-label"><span>Amanha</span></div>
