  ` : ""}

  ${anivs.length ? `
    <div class="section-label"><span>Aniversarios</span><button data-ir="agenda">Gerenciar</button></div>
    <div class="card">
      ${anivs.map((a) => `
        <div class="entry">
          <div style="width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:${a.faltam === 0 ? "var(--brass-faint)" : "var(--raised)"};color:${a.faltam === 0 ? "var(--brass)" : "var(--ink-mute)"}">${ICO.gift}</div>
          <div class="entry-body">
            <b>${esc(a.b.nome)}</b>
            <p>${esc(distanciaTexto(a.prox))}${a.idade ? ` · faz ${a.idade} anos` : ""}${a.b.relacao ? ` · ${esc(a.b.relacao)}` : ""}</p>
          </div>
          ${a.faltam === 0 ? '<span class="pill good">hoje</span>' : ""}
        </div>`).join("")}
    </div>
  ` : ""}
  `;
}

/* ===================== AGENDA ===================== */
function viewAgenda() {
  const semanas = gradeMes(S.mesRef);
  const de = new Date(S.mesRef.getFullYear(), S.mesRef.getMonth() - 1, 20);
  const ate = new Date(S.mesRef.getFullYear(), S.mesRef.getMonth() + 2, 10);
  const ocs = ocorrenciasEntre(S.eventos, de, ate);

  const porDia = new Map();
  for (const oc of ocs) {
    const l = porDia.get(oc.chave) || [];
    l.push(oc);
    porDia.set(oc.chave, l);
  }

  const anivs = aniversariosProximos();
  const temAniv = (d) => S.aniversarios.some((b) => b.dia === d.getDate() && b.mes === d.getMonth() + 1);

  const doDiaSel = porDia.get(chaveDia(S.diaSel)) || [];
  const anivDoDia = anivs.filter((a) => a.b.dia === S.diaSel.getDate() && a.b.mes === S.diaSel.getMonth() + 1);

  const grade = `
    <div class="card" style="padding:16px 10px">
      <div class="cal-nav" style="padding-inline:6px">
        <button class="step" data-mes="-1" aria-label="Mes anterior">${ICO.left}</button>
        <button data-mes="0"><h2>${esc(mesAno(S.mesRef))}</h2></button>
        <button class="step" data-mes="1" aria-label="Proximo mes">${ICO.right}</button>
      </div>
      <div class="cal-grid">${DOW.map((d) => `<div class="cal-dow">${d}</div>`).join("")}</div>
      ${semanas.map((sem) => `<div class="cal-grid">${sem.map((dia) => {
        const k = chaveDia(dia);
        const evs = porDia.get(k) || [];
        const doMes = dia.getMonth() === S.mesRef.getMonth();
        const sel = mesmoDia(dia, S.diaSel);
        const ehHoje = mesmoDia(dia, new Date());
        return `<button class="cal-cell" data-dia="${k}" aria-label="${esc(dataLonga(dia))}">
          <span class="cal-num ${doMes ? "" : "off"} ${ehHoje ? "today" : ""} ${sel ? "sel" : ""}">${dia.getDate()}</span>
          <span class="cal-dots">
            ${evs.slice(0, 3).map(() => `<i class="cal-dot"${sel ? ' style="background:var(--brass-bright)"' : ""}></i>`).join("")}
            ${temAniv(dia) ? '<i class="cal-dot bday"></i>' : ""}
          </span>
        </button>`;
      }).join("")}</div>`).join("")}
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px">
      <h2 style="font-size:17px">${esc(dataLonga(S.diaSel))}</h2>
      <button data-novo-evento style="color:var(--brass);font-size:12px">Adicionar</button>
    </div>

    ${doDiaSel.length || anivDoDia.length ? `
      ${anivDoDia.map((a) => `<div class="card" style="display:flex;gap:12px;align-items:center">
        <span style="color:var(--brass)">${ICO.gift}</span>
        <div style="flex:1"><b style="font-size:14.5px">Aniversario de ${esc(a.b.nome)}</b>
        <p class="tiny mute" style="margin:2px 0 0">${a.idade ? `Completa ${a.idade} anos` : "Sem ano informado"}${a.b.relacao ? ` · ${esc(a.b.relacao)}` : ""}</p></div>
      </div>`).join("")}
      ${doDiaSel.map((oc) => `<div class="card">${linhaCompromisso(oc)}
        ${(oc.evento.empresa || oc.evento.local || oc.repetido) ? `<div class="entry-tags" style="padding-left:58px">
          ${oc.evento.empresa ? `<span class="pill">${esc(empresaCurto(oc.evento.empresa))}</span>` : ""}
          ${oc.evento.local ? `<span class="pill">${esc(oc.evento.local)}</span>` : ""}
          ${oc.repetido ? '<span class="pill">repete</span>' : ""}
        </div>` : ""}</div>`).join("")}
    ` : `<div class="card"><p class="small mute" style="margin:0">Nada marcado para este dia. Toque em adicionar para criar um evento.</p></div>`}
  `;

  const listaAnivs = anivs.length ? anivs.map((a) => `
    <button class="card" style="display:flex;gap:12px;align-items:center;width:100%;text-align:left" data-abrir-aniv="${esc(a.b.id)}">
      <span style="width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:${a.faltam <= 7 ? "var(--brass-faint)" : "var(--raised)"};font-family:var(--mono);color:var(--brass)">${a.b.dia}</span>
      <div style="flex:1;min-width:0">
        <b style="font-size:14.5px">${esc(a.b.nome)}</b>
        <p class="tiny mute" style="margin:2px 0 0">${esc(dataLonga(a.prox))} · ${esc(distanciaTexto(a.prox))}${a.idade ? ` · faz ${a.idade}` : ""}</p>
        ${a.b.relacao ? `<div class="entry-tags"><span class="pill">${esc(a.b.relacao)}</span></div>` : ""}
      </div>
      ${a.faltam === 0 ? '<span class="pill good">hoje</span>' : ""}
    </button>`).join("") : `
    <div class="empty">
      <div class="mark">${ICO.gift}</div>
      <h3>Nenhum aniversario cadastrado</h3>
      <p>Cadastre a data e o nome, e escolha com quanta antecedencia o Watson deve avisar.</p>
      <div style="height:18px"></div>
      <button class="btn ghost" data-novo-aniv>Adicionar o primeiro</button>
    </div>`;

  return `
  <div class="head">
    <div class="head-text">
      <div class="eyebrow">Sua agenda</div>
      <h1>${S.abaAgenda === "mes" ? "Calendario" : "Aniversarios"}</h1>
    </div>
    <button class="add" ${S.abaAgenda === "mes" ? "data-novo-evento" : "data-novo-aniv"} aria-label="Adicionar">${ICO.plus}</button>
  </div>

  <div class="chips">
    <button class="chip" data-aba-agenda="mes" aria-pressed="${S.abaAgenda === "mes"}">Mes</button>
    <button class="chip" data-aba-agenda="aniversarios" aria-pressed="${S.abaAgenda === "aniversarios"}">Aniversarios${S.aniversarios.length ? ` (${S.aniversarios.length})` : ""}</button>
  </div>

  ${S.abaAgenda === "mes" ? grade : listaAnivs}
  `;
}
</script>
<script>
"use strict";

/* ===================== SAUDE ===================== */
const TAMANHO_PERIODO = { dia: 1, semana: 7, mes: 30 };

function viewSaude() {
  const tam = TAMANHO_PERIODO[S.periodoSaude];
  const hoje = new Date();
  const de = somaDias(hoje, -(tam - 1));
  const dias = saudeEntre(chaveDia(de), chaveDia(hoje));
  const anteriores = saudeEntre(chaveDia(somaDias(de, -tam)), chaveDia(somaDias(de, -1)));

  const ultimo = dias.length ? dias[dias.length - 1] : null;
  const faixa = faixaRecuperacao(ultimo && ultimo.recuperacao);
  const alertas = avaliarSaude(S.saude.slice(-90));

  const ocs90 = ocorrenciasEntre(S.eventos, somaDias(hoje, -90), hoje);
  const impactos = impactoReunioes(ocs90, S.saude.slice(-90)).slice(0, 5);

  // Serie continua, com lacuna onde nao houve registro.
  const continua = [];
  for (let i = tam - 1; i >= 0; i -= 1) {
    const d = somaDias(hoje, -i);
    const reg = dias.find((x) => x.data === chaveDia(d));
    continua.push({
      r: tam <= 7 ? DOW[d.getDay()] : (i % 6 === 0 ? String(d.getDate()) : ""),
      v: reg ? reg.recuperacao : null,
      cor: reg && ehNum(reg.recuperacao) ? `var(--${faixaRecuperacao(reg.recuperacao).tom || "brass"})` : null,
    });
  }

  const cabeca = `
  <div class="head">
    <div class="head-text">
      <div class="eyebrow">Indicadores do Whoop</div>
      <h1>Saude</h1>
    </div>
    <button class="add" data-novo-relatorio aria-label="Lancar relatorio">${ICO.plus}</button>
  </div>
  <div class="chips">
    ${["dia", "semana", "mes"].map((p) => `<button class="chip" data-periodo="${p}" aria-pressed="${S.periodoSaude === p}">${p === "dia" ? "Hoje" : p === "semana" ? "7 dias" : "30 dias"}</button>`).join("")}
  </div>`;

  if (!dias.length) {
    return cabeca + `
    <div class="empty">
      <div class="mark">${ICO.pulse}</div>
      <h3>Nenhum indicador neste periodo</h3>
      <p>Cole o relatorio do Whoop e o Watson organiza tudo: recuperacao, sono, esforco e variabilidade cardiaca, dia a dia.</p>
      <div style="height:18px"></div>
      <button class="btn ghost" data-novo-relatorio>Lancar relatorio</button>
    </div>`;
  }

  return cabeca + `
  <div class="card lit">
    <div class="gauge-row">
      ${medidor(ultimo.recuperacao, `var(--${faixa.tom || "brass"})`, "recuperacao", 104)}
      <div style="flex:1;min-width:0">
        <span class="pill ${faixa.tom}">Recuperacao ${esc(faixa.rotulo)}</span>
        <p class="tiny mute" style="margin:7px 0 0">Ultimo registro em ${esc(ultimo.data)}</p>
        <div class="stat-pair">
          <div><b class="num">${ehNum(ultimo.sono) ? ultimo.sono.toFixed(1) : "--"}</b><span>HORAS DE SONO</span></div>
          <div><b class="num">${ehNum(ultimo.esforco) ? ultimo.esforco.toFixed(1) : "--"}</b><span>ESFORCO</span></div>
        </div>
      </div>
    </div>
    ${S.periodoSaude !== "dia" ? `
      <div style="margin-top:20px">
        <div class="tiny mute" style="margin-bottom:8px">Recuperacao diaria · ${S.periodoSaude === "semana" ? "ultimos 7 dias" : "ultimos 30 dias"}</div>
        ${barras(continua, 100, 104)}
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">
          <span class="tiny" style="display:flex;align-items:center;gap:5px;color:var(--ink-mute)"><i style="width:8px;height:8px;border-radius:2px;background:var(--good);display:inline-block"></i>boa, 67% ou mais</span>
          <span class="tiny" style="display:flex;align-items:center;gap:5px;color:var(--ink-mute)"><i style="width:8px;height:8px;border-radius:2px;background:var(--warn);display:inline-block"></i>moderada, 34 a 66%</span>
          <span class="tiny" style="display:flex;align-items:center;gap:5px;color:var(--ink-mute)"><i style="width:8px;height:8px;border-radius:2px;background:var(--crit);display:inline-block"></i>baixa, abaixo de 34%</span>
        </div>
        <p class="tiny mute" style="margin:8px 0 0">Colunas apagadas sao dias sem registro. A escala vai de 0 a 100%.</p>
      </div>` : ""}
  </div>

  ${alertas.length ? `
    <div class="section-label"><span>Vigilancia do Watson</span></div>
    ${alertas.map((a) => `<div class="card alert">
      <span class="glyph" style="color:var(--${a.tom === "crit" ? "crit" : a.tom === "warn" ? "warn" : "good"})">${a.tom === "good" ? ICO.check : ICO.alert}</span>
      <div><b>${esc(a.titulo)}</b><p>${esc(a.texto)}</p></div>
    </div>`).join("")}
    <p class="tiny mute" style="margin:10px 2px 0">O Watson le numeros, nao diagnostica. Sinais persistentes merecem um medico.</p>
  ` : ""}

  <div class="section-label"><span>Indicadores no periodo</span></div>
  ${METRICAS_PRINCIPAIS.map((campo) => {
    const r = resumirMetrica(campo, dias, anteriores);
    if (!r.amostras) return "";
    const meta = METRICAS[campo];
    const sobe = (r.variacao || 0) > 0;
    return `<div class="card">
      <div class="tiny mute" style="letter-spacing:.04em">${esc(meta.rotulo)}</div>
      <div class="metric" style="margin-top:3px">
        <b class="num">${r.media.toFixed(meta.dec)}</b>
        <u>${esc(meta.unidade)}</u>
        ${r.variacao !== null && Math.abs(r.variacao) >= 1 ? `<span class="delta">${sobe ? "+" : "-"}${Math.abs(Math.round(r.variacao))}%</span>` : ""}
      </div>
      <p class="tiny mute" style="margin:3px 0 10px">media de ${r.amostras} dia${r.amostras > 1 ? "s" : ""} · minimo ${r.minimo.toFixed(meta.dec)} · maximo ${r.maximo.toFixed(meta.dec)}</p>
      ${dias.length > 2 ? sparkline(dias.map((d) => d[campo])) : ""}
    </div>`;
  }).join("")}

  ${impactos.length ? `
    <div class="section-label"><span>Agenda cruzada com recuperacao</span></div>
    <div class="card">
      <p class="tiny mute" style="margin:0 0 14px">Recuperacao no dia seguinte a cada reuniao recorrente, comparada com a sua media do periodo. E um indicio para investigar, nao uma prova de causa.</p>
      ${impactos.map((i, k) => `<div style="display:flex;align-items:center;gap:12px;padding:9px 0${k ? ";border-top:1px solid var(--line)" : ""}">
        <div style="flex:1;min-width:0">
          <b style="font-size:14px;display:block">${esc(i.titulo)}</b>
          <p class="tiny mute" style="margin:2px 0 0">${i.ocorrencias} ocorrencias · recuperacao seguinte ${Math.round(i.recuperacaoSeguinte)}%</p>
        </div>
        <span class="pill ${i.delta < -3 ? "crit" : i.delta > 3 ? "good" : ""}">${i.delta > 0 ? "+" : ""}${i.delta.toFixed(1)} pts</span>
      </div>`).join("")}
    </div>
  ` : ""}
  `;
}

/* ===================== DOSSIES ===================== */
function viewDossies() {
  const lista = S.busca.trim().length >= 3
    ? buscarDossies(S.busca)
    : (S.filtroEmpresa === "todas" ? S.dossies : S.dossies.filter((d) => d.empresa === S.filtroEmpresa));

  const contagem = {};
  for (const d of S.dossies) contagem[d.empresa] = (contagem[d.empresa] || 0) + 1;
  const buscando = S.busca.trim().length >= 3;

  return `
  <div class="head">
    <div class="head-text">
      <div class="eyebrow">Base de conhecimento</div>
      <h1>Dossies</h1>
    </div>
    <button class="add" data-novo-dossie aria-label="Adicionar dossie">${ICO.plus}</button>
  </div>

  <div class="search">
    <span class="mute">${ICO.search}</span>
    <input id="campo-busca" type="search" placeholder="Buscar por assunto, pessoa ou decisao" value="${esc(S.busca)}" autocomplete="off">
    ${S.busca ? `<button data-limpar-busca class="mute" aria-label="Limpar busca">${ICO.close}</button>` : ""}
  </div>

  ${!buscando ? `<div class="chips">
    <button class="chip" data-empresa="todas" aria-pressed="${S.filtroEmpresa === "todas"}">Todas${S.dossies.length ? ` (${S.dossies.length})` : ""}</button>
    ${EMPRESAS.map((e) => `<button class="chip" data-empresa="${e.id}" aria-pressed="${S.filtroEmpresa === e.id}">${esc(e.curto)}${contagem[e.id] ? ` (${contagem[e.id]})` : ""}</button>`).join("")}
  </div>` : ""}

  ${lista.length ? lista.map((d) => `
    <button class="card dossier" style="width:100%;text-align:left;display:block" data-abrir-dossie="${esc(d.id)}">
      <div class="meta">
        <span class="pill">${esc(empresaCurto(d.empresa))}</span>
        <span class="tiny mute num">${esc(d.data)}</span>
      </div>
      <h3>${esc(d.titulo)}</h3>
      <p>${esc(String(d.resumo || "").slice(0, 190))}${String(d.resumo || "").length > 190 ? "..." : ""}</p>
      ${(d.temas || []).length ? `<div class="topics">${(d.temas || []).slice(0, 5).map((t) => `<span class="topic">${esc(t)}</span>`).join("")}</div>` : ""}
    </button>`).join("") : `
    <div class="empty">
      <div class="mark">${buscando ? ICO.search : ICO.books}</div>
      <h3>${buscando ? "Nada encontrado" : "A base esta vazia"}</h3>
      <p>${buscando ? "Nenhum dossie casa com esses termos. Tente outras palavras ou limpe a busca." : "Cole aqui os resumos das suas reunioes. Cada uma vira um dossie classificado, e o Watson passa a responder perguntas sobre tudo o que foi tratado."}</p>
      ${buscando ? "" : '<div style="height:18px"></div><button class="btn ghost" data-novo-dossie>Adicionar o primeiro</button>'}
    </div>`}
  `;
}

/* ===================== AJUSTES ===================== */
function viewAjustes() {
  const registros = S.eventos.length + S.aniversarios.length + S.saude.length + S.dossies.length;
  return `
  <div class="head">
    <div class="head-text">
      <div class="eyebrow">Configuracoes</div>
      <h1>Ajustes</h1>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      <div><b class="num" style="font-family:var(--serif);font-size:23px;display:block">${S.eventos.length}</b><span class="tiny mute">eventos</span></div>
      <div><b class="num" style="font-family:var(--serif);font-size:23px;display:block">${S.aniversarios.length}</b><span class="tiny mute">aniversarios</span></div>
      <div><b class="num" style="font-family:var(--serif);font-size:23px;display:block">${S.saude.length}</b><span class="tiny mute">dias de saude</span></div>
      <div><b class="num" style="font-family:var(--serif);font-size:23px;display:block">${S.dossies.length}</b><span class="tiny mute">dossies</span></div>
    </div>
    ${S.demonstracao ? '<hr class="rule"><p class="tiny" style="color:var(--warn);margin:0">Os numeros acima sao do exemplo. Some assim que voce registrar algo real.</p>' : ""}
  </div>

  <div class="section-label"><span>Backup</span></div>
  <div class="card">
    <p class="small dim" style="margin:0 0 6px">Seus dados ficam guardados na sua conta. Um backup serve para voce ter uma copia fora daqui, em arquivo, que pode abrir em qualquer planilha ou editor.</p>
    <p class="tiny mute" style="margin:0 0 14px">${registros} ${registros === 1 ? "registro" : "registros"} seriam exportados.</p>
    <button class="btn ghost" data-exportar>${ICO.down} Baixar copia dos meus dados</button>
  </div>

  <div class="section-label"><span>Como o Watson trata seus dados</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="color:var(--brass);flex:none;margin-top:1px">${ICO.lock}</span>
      <p class="tiny dim" style="margin:0">Agenda, saude e dossies ficam na sua conta Claude. Esta pagina nasceu privada: ninguem abre sem voce compartilhar o link.</p>
    </div>
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="color:var(--brass);flex:none;margin-top:1px">${ICO.glass}</span>
      <p class="tiny dim" style="margin:0">Quando voce pergunta algo, o Watson consulta a sua base e envia apenas os trechos relacionados. Cada resposta mostra embaixo o que foi consultado.</p>
    </div>
    <div style="display:flex;gap:11px;align-items:flex-start">
      <span style="color:var(--brass);flex:none;margin-top:1px">${ICO.alert}</span>
      <p class="tiny dim" style="margin:0">Os indicadores de saude servem para observar tendencias. O Watson nao diagnostica nada, e um sinal que persiste e assunto para um medico.</p>
    </div>
  </div>

  <div class="section-label"><span>Resumo diario</span></div>
  <div class="card">
    <p class="small dim" style="margin:0 0 6px">Toda manha voce recebe o resumo do dia com reunioes, aniversarios e alertas de saude, sem precisar abrir esta pagina.</p>
    <p class="tiny mute" style="margin:0">Se quiser mudar o horario ou parar de receber, e so pedir na conversa com o Claude.</p>
  </div>

  <p class="tiny mute" style="text-align:center;margin-top:26px">Watson · assistente pessoal e corporativo</p>
  `;
}
</script>
<script>
"use strict";

/* ---------- painel deslizante ---------- */
let fecharPainelAtual = null;

function abrirPainel({ titulo, subtitulo, corpo, rodape, aoMontar }) {
  fecharPainel();
  const host = $("#panel-host");
  host.innerHTML = `
    <div class="scrim" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <div class="panel">
        <div class="panel-grip"></div>
        <div class="panel-head">
          <div style="flex:1;min-width:0"><h2>${esc(titulo)}</h2>${subtitulo ? `<p>${esc(subtitulo)}</p>` : ""}</div>
          <button class="panel-close" data-fechar aria-label="Fechar">${ICO.close}</button>
        </div>
        <div class="panel-body">${corpo}</div>
        ${rodape ? `<div class="panel-foot">${rodape}</div>` : ""}
      </div>
    </div>`;

  const scrim = $(".scrim", host);
  scrim.addEventListener("mousedown", (e) => { if (e.target === scrim) fecharPainel(); });
  liga(host, "[data-fechar]", "click", fecharPainel);
  document.addEventListener("keydown", aoEsc);
  if (aoMontar) aoMontar(host);
  const foco = $("input, textarea, button", $(".panel-body", host));
  if (foco && foco.tagName !== "BUTTON") setTimeout(() => foco.focus(), 60);
  fecharPainelAtual = () => { host.innerHTML = ""; document.removeEventListener("keydown", aoEsc); fecharPainelAtual = null; };
}

function aoEsc(e) { if (e.key === "Escape") fecharPainel(); }
function fecharPainel() { if (fecharPainelAtual) fecharPainelAtual(); }

const campo = (id, rotulo, extra = {}) => `
  <label class="field" for="${id}"><span>${esc(rotulo)}</span>
    ${extra.area
      ? `<textarea id="${id}" placeholder="${esc(extra.ph || "")}" ${extra.alto ? 'style="min-height:' + extra.alto + 'px"' : ""}>${esc(extra.v || "")}</textarea>`
      : `<input id="${id}" type="${extra.tipo || "text"}" placeholder="${esc(extra.ph || "")}" value="${esc(extra.v || "")}" ${extra.modo ? `inputmode="${extra.modo}"` : ""} ${extra.max ? `maxlength="${extra.max}"` : ""}>`}
    ${extra.dica ? `<span class="hint">${esc(extra.dica)}</span>` : ""}
  </label>`;

const grupoChips = (nome, opcoes, ativo) => `
  <div class="chips" data-grupo="${nome}">
    ${opcoes.map((o) => `<button type="button" class="chip" data-valor="${esc(o.id)}" aria-pressed="${String(o.id) === String(ativo)}">${esc(o.rotulo)}</button>`).join("")}
  </div>`;

function ativarGrupos(host) {
  liga(host, "[data-grupo] .chip", "click", (e) => {
    const grupo = e.currentTarget.closest("[data-grupo]");
    const multi = grupo.dataset.multi === "1";
    if (multi) {
      const p = e.currentTarget.getAttribute("aria-pressed") === "true";
      e.currentTarget.setAttribute("aria-pressed", String(!p));
    } else {
      $$(".chip", grupo).forEach((c) => c.setAttribute("aria-pressed", "false"));
      e.currentTarget.setAttribute("aria-pressed", "true");
    }
  });
}

const lerGrupo = (host, nome) => {
  const el = $(`[data-grupo="${nome}"] .chip[aria-pressed="true"]`, host);
  return el ? el.dataset.valor : null;
};
const lerGrupoMulti = (host, nome) =>
  $$(`[data-grupo="${nome}"] .chip[aria-pressed="true"]`, host).map((c) => Number(c.dataset.valor));

const erroPainel = (host, msg) => {
  const alvo = $("#erro-painel", host);
  if (alvo) { alvo.textContent = msg; alvo.hidden = !msg; }
};

/* ---------- formulario de evento ---------- */
const HORA_OK = /^([01]\d|2[0-3]):([0-5]\d)$/;
function mascaraHora(v, antes) {
  const d = v.replace(/\D/g, "").slice(0, 4);
  if (v.length < antes.length && antes.endsWith(":")) return d.slice(0, 1);
  return d.length <= 2 ? d : `${d.slice(0, 2)}:${d.slice(2)}`;
}

function painelEvento(existente) {
  const ev = existente || null;
  const base = ev ? new Date(ev.inicio) : S.diaSel;
  const hIni = ev && !ev.diaInteiro ? hora(new Date(ev.inicio)) : "09:00";
  const hFim = ev && ev.fim ? hora(new Date(ev.fim)) : (ev ? "" : "10:00");
  const lembretes = (ev && ev.lembretes) || [60];

  const corpo = `
    ${campo("ev-titulo", "Titulo do evento", { ph: "Reuniao de diretoria", v: ev ? ev.titulo : "" })}
    ${campo("ev-desc", "Descricao", { area: true, ph: "Pauta, participantes, o que precisa ser decidido", v: ev ? ev.descricao : "" })}
    <div class="field"><span>Tipo</span>${grupoChips("cat", CATEGORIAS.map((c) => ({ id: c.id, rotulo: c.rotulo })), ev ? ev.categoria : "reuniao")}</div>
    <div class="field"><span>Empresa do grupo</span>${grupoChips("emp", [{ id: "", rotulo: "Nenhuma" }].concat(EMPRESAS.map((e) => ({ id: e.id, rotulo: e.curto }))), ev ? (ev.empresa || "") : "")}</div>
    ${campo("ev-local", "Local", { ph: "Sala, endereco ou link", v: ev ? ev.local : "" })}
    <div class="field"><span>Horario</span>${grupoChips("inteiro", [{ id: "nao", rotulo: "Com horario" }, { id: "sim", rotulo: "Dia inteiro" }], ev && ev.diaInteiro ? "sim" : "nao")}</div>
    <div class="field-row" id="linha-horas">
      ${campo("ev-ini", "Comeca", { v: hIni, ph: "09:00", modo: "numeric", max: 5 })}
      ${campo("ev-fim", "Termina", { v: hFim, ph: "10:00", modo: "numeric", max: 5 })}
    </div>
    <div class="field"><span>Repeticao</span>${grupoChips("rec", RECORRENCIAS.map((r) => ({ id: r.id, rotulo: r.rotulo })), ev ? ev.recorrencia : "unico")}</div>
    ${campo("ev-ate", "Repetir ate (opcional)", { ph: "AAAA-MM-DD", v: ev ? ev.ate : "", dica: "Deixe vazio para repetir sem data final." })}
    <div class="field"><span>Lembretes</span>
      <div class="chips" data-grupo="lem" data-multi="1">
        ${LEMBRETES.map((l) => `<button type="button" class="chip" data-valor="${l.m}" aria-pressed="${lembretes.includes(l.m)}">${esc(l.r)}</button>`).join("")}
      </div>
      <span class="hint">O Watson mostra o que esta proximo ao abrir, e inclui no seu resumo da manha.</span>
    </div>
    <p class="err" id="erro-painel" hidden></p>`;

  const rodape = `
    <button class="btn" id="salvar-ev">${ev ? "Salvar alteracoes" : "Adicionar a agenda"}</button>
    ${ev ? '<button class="btn danger" id="excluir-ev">Excluir evento</button>' : ""}`;

  abrirPainel({
    titulo: ev ? "Editar evento" : "Novo evento",
    subtitulo: dataLonga(base),
    corpo, rodape,
    aoMontar(host) {
      ativarGrupos(host);
      const alternarHoras = () => { $("#linha-horas", host).hidden = lerGrupo(host, "inteiro") === "sim"; };
      alternarHoras();
      liga(host, '[data-grupo="inteiro"] .chip', "click", alternarHoras);
      ["ev-ini", "ev-fim"].forEach((id) => {
        const el = $("#" + id, host);
        let antes = el.value;
        el.addEventListener("input", () => { el.value = mascaraHora(el.value, antes); antes = el.value; });
      });

      $("#salvar-ev", host).addEventListener("click", async () => {
        const titulo = $("#ev-titulo", host).value.trim();
        const inteiro = lerGrupo(host, "inteiro") === "sim";
        const ini = $("#ev-ini", host).value.trim();
        const fim = $("#ev-fim", host).value.trim();

        if (titulo.length < 2) return erroPainel(host, "Escreva um titulo para o evento.");
        if (!inteiro && !HORA_OK.test(ini)) return erroPainel(host, "Hora de inicio invalida. Use o formato HH:MM.");
        if (!inteiro && fim && !HORA_OK.test(fim)) return erroPainel(host, "Hora de termino invalida.");

        const dia = ev ? new Date(ev.inicio) : S.diaSel;
        const montar = (hhmm) => { const d = new Date(dia); const [h, m] = hhmm.split(":").map(Number); d.setHours(h || 0, m || 0, 0, 0); return d; };
        const dIni = inteiro ? montar("00:00") : montar(ini);
        const dFim = inteiro || !fim ? null : montar(fim);
        if (dFim && dFim <= dIni) return erroPainel(host, "O termino precisa ser depois do inicio.");

        const rec = lerGrupo(host, "rec") || "unico";
        const dados = {
          titulo,
          descricao: $("#ev-desc", host).value.trim(),
          categoria: lerGrupo(host, "cat") || "reuniao",
          empresa: lerGrupo(host, "emp") || "",
          local: $("#ev-local", host).value.trim(),
          inicio: dIni.toISOString(),
          fim: dFim ? dFim.toISOString() : null,
          diaInteiro: inteiro,
          recorrencia: rec,
          ate: rec !== "unico" ? $("#ev-ate", host).value.trim() : "",
          lembretes: lerGrupoMulti(host, "lem"),
          criadoEm: ev ? ev.criadoEm : new Date().toISOString(),
        };

        await salvar("eventos", ev ? ev.id : novoId(), dados);
        fecharPainel();
        render();
      });

      const btnEx = $("#excluir-ev", host);
      if (btnEx) btnEx.addEventListener("click", () => confirmarExclusao(`"${ev.titulo}" sai da agenda, junto de todas as repeticoes.`, async () => {
        await remover("eventos", ev.id); fecharPainel(); render();
      }));
    },
  });
}

/* ---------- confirmacao ----------
   O viewer nao mostra confirm() do navegador, entao a pergunta vive na
   propria pagina. */
function confirmarExclusao(texto, aoConfirmar) {
  abrirPainel({
    titulo: "Confirmar exclusao",
    corpo: `<p class="small dim" style="margin:0">${esc(texto)} Isso nao pode ser desfeito.</p>`,
    rodape: `<button class="btn danger" id="conf-sim">Excluir mesmo assim</button><button class="btn bare" data-fechar>Cancelar</button>`,
    aoMontar(host) { $("#conf-sim", host).addEventListener("click", aoConfirmar); },
  });
}

/* ---------- formulario de aniversario ---------- */
const DIAMES_OK = /^(0[1-9]|[12]\d|3[01])\/(0[1-9]|1[0-2])$/;
function mascaraDiaMes(v, antes) {
  const d = v.replace(/\D/g, "").slice(0, 4);
  if (v.length < antes.length && antes.endsWith("/")) return d.slice(0, 1);
  return d.length <= 2 ? d : `${d.slice(0, 2)}/${d.slice(2)}`;
}

function painelAniversario(existente) {
  const b = existente || null;
  const lembretes = (b && b.lembretes) || [10080, 1440];

  const corpo = `
    ${campo("an-nome", "Nome da pessoa", { ph: "Nome completo", v: b ? b.nome : "" })}
    <div class="field-row">
      ${campo("an-data", "Dia e mes", { ph: "DD/MM", v: b ? `${pad(b.dia)}/${pad(b.mes)}` : "", modo: "numeric", max: 5, dica: "Por exemplo 07/09." })}
      ${campo("an-ano", "Ano (opcional)", { ph: "1975", v: b && b.ano ? b.ano : "", modo: "numeric", max: 4, dica: "Para calcular a idade." })}
    </div>
    ${campo("an-rel", "Relacao", { ph: "Socio, cliente, familia, equipe", v: b ? b.relacao : "" })}
    ${campo("an-notas", "Observacoes", { area: true, ph: "O que lembrar na hora de cumprimentar", v: b ? b.notas : "" })}
    <div class="field"><span>Lembretes</span>
      <div class="chips" data-grupo="lem" data-multi="1">
        ${LEMBRETES.map((l) => `<button type="button" class="chip" data-valor="${l.m}" aria-pressed="${lembretes.includes(l.m)}">${esc(l.r)}</button>`).join("")}
      </div>
    </div>
    <p class="err" id="erro-painel" hidden></p>`;

  abrirPainel({
    titulo: b ? "Editar aniversario" : "Novo aniversario",
    subtitulo: "O Watson avisa com a antecedencia que voce escolher.",
    corpo,
    rodape: `<button class="btn" id="salvar-an">${b ? "Salvar alteracoes" : "Adicionar aniversario"}</button>${b ? '<button class="btn danger" id="excluir-an">Excluir</button>' : ""}`,
    aoMontar(host) {
      ativarGrupos(host);
      const el = $("#an-data", host);
      let antes = el.value;
      el.addEventListener("input", () => { el.value = mascaraDiaMes(el.value, antes); antes = el.value; });

      $("#salvar-an", host).addEventListener("click", async () => {
        const nome = $("#an-nome", host).value.trim();
        const data = $("#an-data", host).value.trim();
        const anoTxt = $("#an-ano", host).value.trim();
        if (nome.length < 2) return erroPainel(host, "Escreva o nome da pessoa.");
        if (!DIAMES_OK.test(data)) return erroPainel(host, "Informe o dia e o mes no formato DD/MM.");
        const ano = anoTxt ? Number(anoTxt) : null;
        if (ano !== null && (ano < 1900 || ano > new Date().getFullYear())) return erroPainel(host, "Ano de nascimento invalido.");

        const [dia, mes] = data.split("/").map(Number);
        await salvar("aniversarios", b ? b.id : novoId(), {
          nome, dia, mes, ano,
          relacao: $("#an-rel", host).value.trim(),
          notas: $("#an-notas", host).value.trim(),
          lembretes: lerGrupoMulti(host, "lem"),
        });
        fecharPainel();
        render();
      });

      const btnEx = $("#excluir-an", host);
      if (btnEx) btnEx.addEventListener("click", () => confirmarExclusao(`${b.nome} sai da lista de aniversarios.`, async () => {
        await remover("aniversarios", b.id); fecharPainel(); render();
      }));
    },
  });
}
</script>
<script>
"use strict";

/* ---------- relatorio do Whoop ----------
   A leitura automatica sempre termina em uma tela de conferencia: a IA
   separa os numeros depressa, mas quem assina os dados e o usuario. */
const CAMPOS_SAUDE = ["recuperacao", "vfc", "fcRepouso", "sono", "desempenhoSono", "esforco", "calorias", "respiracao", "oxigenacao", "temperatura"];
const DATA_OK = /^\d{4}-\d{2}-\d{2}$/;

function painelRelatorio(existente) {
  let etapa = existente ? "conferir" : "colar";
  let valores = {};
  let dataAlvo = existente ? existente.data : hojeISO();
  let bruto = "";

  if (existente) for (const c of CAMPOS_SAUDE) if (ehNum(existente[c])) valores[c] = String(existente[c]);

  function desenhar() {
    const corpoColar = `
      <div class="banner">${ICO.info}<span>No aplicativo do Whoop, abra o resumo do dia, copie o texto e cole aqui. Pode colar tudo: o Watson separa o que interessa.</span></div>
      <div style="height:14px"></div>
      <label class="field" for="wh-texto"><span>Relatorio</span>
        <textarea id="wh-texto" style="min-height:190px" placeholder="Exemplo:&#10;Recovery 62%&#10;HRV 48 ms&#10;RHR 54 bpm&#10;Sleep 6h45 / 88% performance&#10;Day Strain 13.4">${esc(bruto)}</textarea>
      </label>
      <p class="err" id="erro-painel" hidden></p>`;

    const corpoConferir = `
      ${campo("wh-data", "Data do relatorio", { ph: "AAAA-MM-DD", v: dataAlvo })}
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${CAMPOS_SAUDE.map((c) => `<div style="width:47%;flex-grow:1;min-width:130px">
          ${campo("wh-" + c, METRICAS[c].rotulo + (METRICAS[c].unidade ? ` (${METRICAS[c].unidade})` : ""), { ph: "--", v: valores[c] || "", modo: "decimal" })}
        </div>`).join("")}
      </div>
      <p class="err" id="erro-painel" hidden></p>`;

    const preenchidos = CAMPOS_SAUDE.filter((c) => valores[c]).length;

    abrirPainel({
      titulo: etapa === "colar" ? "Novo relatorio do Whoop" : "Conferir indicadores",
      subtitulo: etapa === "colar"
        ? "Cole o texto do aplicativo e deixe o Watson separar os numeros."
        : `${preenchidos} ${preenchidos === 1 ? "indicador lido" : "indicadores lidos"}. Corrija o que estiver errado.`,
      corpo: etapa === "colar" ? corpoColar : corpoConferir,
      rodape: etapa === "colar"
        ? `<button class="btn" id="wh-ler">${ICO.spark} Ler com o Watson</button><button class="btn bare" id="wh-manual">Preencher manualmente</button>`
        : `<button class="btn" id="wh-salvar">Salvar no meu historico</button>${existente ? `<button class="btn danger" id="wh-excluir">Excluir este dia</button>` : `<button class="btn bare" id="wh-voltar">Voltar ao texto</button>`}`,
      aoMontar(host) {
        if (etapa === "colar") {
          $("#wh-manual", host).addEventListener("click", () => { bruto = $("#wh-texto", host).value; etapa = "conferir"; desenhar(); });
          $("#wh-ler", host).addEventListener("click", async () => {
            bruto = $("#wh-texto", host).value.trim();
            if (bruto.length < 15) return erroPainel(host, "Cole o relatorio do Whoop antes de continuar.");
            if (!S.sample) { erroPainel(host, "A leitura automatica nao esta disponivel aqui. Preencha os campos na mao."); etapa = "conferir"; return desenhar(); }

            const botao = $("#wh-ler", host);
            botao.disabled = true;
            botao.innerHTML = '<span class="spin"></span> Lendo';
            try {
              const r = await S.sample.json(
                `Extraia os indicadores de saude deste relatorio do Whoop e devolva SOMENTE um objeto JSON.

Chaves possiveis, todas opcionais: data (AAAA-MM-DD), recuperacao (0 a 100), vfc (ms), fcRepouso (bpm), sono (horas decimais, 7h30 vira 7.5), desempenhoSono (0 a 100), esforco (escala Whoop de 0 a 21), calorias, respiracao (por minuto), oxigenacao (0 a 100), temperatura (Celsius).

Regras: use apenas numeros que estao escritos no texto; nunca estime nem complete. Omita a chave quando o indicador nao aparecer. Ausente e sempre melhor que um palpite.

Relatorio:
${bruto.slice(0, 6000)}`,
                { modelTier: "quick", cache: false },
              );
              if (r && typeof r === "object") {
                for (const c of CAMPOS_SAUDE) if (ehNum(r[c])) valores[c] = String(r[c]);
                if (typeof r.data === "string" && DATA_OK.test(r.data)) dataAlvo = r.data;
              }
              etapa = "conferir";
              desenhar();
            } catch (e) {
              const cod = e && e.code;
              etapa = "conferir";
              desenhar();
              const h2 = $("#panel-host");
              erroPainel(h2, cod === "not_granted"
                ? "Voce recusou o acesso ao Claude. Preencha os campos na mao."
                : "A leitura falhou. Confira ou preencha os campos manualmente.");
            }
          });
        } else {
          $("#wh-salvar", host).addEventListener("click", async () => {
            const data = $("#wh-data", host).value.trim();
            if (!DATA_OK.test(data)) return erroPainel(host, "Informe a data no formato AAAA-MM-DD.");
            const dados = { data, fonte: "whoop", textoBruto: bruto ? bruto.slice(0, 4000) : "" };
            let algum = false;
            for (const c of CAMPOS_SAUDE) {
              const v = ($("#wh-" + c, host).value || "").replace(",", ".").trim();
              if (v && !Number.isNaN(Number(v))) { dados[c] = Number(v); algum = true; }
            }
            if (!algum) return erroPainel(host, "Preencha ao menos um indicador.");
            if (existente && existente.data !== data) await remover("saude", existente.id);
            await salvar("saude", data, dados);
            fecharPainel();
            render();
          });
          const voltar = $("#wh-voltar", host);
          if (voltar) voltar.addEventListener("click", () => { etapa = "colar"; desenhar(); });
          const excluir = $("#wh-excluir", host);
          if (excluir) excluir.addEventListener("click", () => confirmarExclusao(`Os indicadores de ${existente.data} serao apagados.`, async () => {
            await remover("saude", existente.id); fecharPainel(); render();
          }));
        }
      },
    });
  }
  desenhar();
}

/* ---------- dossie ---------- */
function painelDossie(existente) {
  const d = existente || null;
  let etapa = d ? "conferir" : "colar";
  let bruto = d ? (d.textoBruto || "") : "";
  let campos = d ? {
    titulo: d.titulo, empresa: d.empresa, data: d.data,
    participantes: (d.participantes || []).join(", "),
    temas: (d.temas || []).join(", "),
    resumo: d.resumo, decisoes: d.decisoes || "", acoes: d.acoes || "",
  } : { titulo: "", empresa: "grupo", data: hojeISO(), participantes: "", temas: "", resumo: "", decisoes: "", acoes: "" };

  function desenhar() {
    const corpoColar = `
      <div class="banner">${ICO.info}<span>Cole o resumo da reuniao, do Plaud ou de onde vier. O Watson identifica titulo, empresa do grupo, participantes, decisoes e acoes, e guarda o texto original junto.</span></div>
      <div style="height:14px"></div>
      <label class="field" for="do-bruto"><span>Resumo ou transcricao</span>
        <textarea id="do-bruto" style="min-height:210px" placeholder="Cole aqui o resumo da reuniao">${esc(bruto)}</textarea>
      </label>
      <p class="err" id="erro-painel" hidden></p>`;

    const corpoConferir = `
      ${campo("do-titulo", "Titulo do dossie", { ph: "Reuniao de diretoria sobre o contrato", v: campos.titulo })}
      <div class="field"><span>Empresa do grupo</span>${grupoChips("emp", EMPRESAS.map((e) => ({ id: e.id, rotulo: e.curto })), campos.empresa)}</div>
      ${campo("do-data", "Data da reuniao", { ph: "AAAA-MM-DD", v: campos.data })}
      ${campo("do-part", "Participantes", { ph: "Separados por virgula", v: campos.participantes })}
      ${campo("do-temas", "Temas", { ph: "contrato, sinalizacao, prazo", v: campos.temas, dica: "Separados por virgula. Sao eles que orientam a busca." })}
      ${campo("do-resumo", "Resumo", { area: true, alto: 140, ph: "O que foi tratado", v: campos.resumo })}
      ${campo("do-dec", "Decisoes", { area: true, ph: "Uma decisao por linha", v: campos.decisoes })}
      ${campo("do-acoes", "Acoes combinadas", { area: true, ph: "Responsavel, o que fazer e prazo", v: campos.acoes })}
      <p class="err" id="erro-painel" hidden></p>`;

    abrirPainel({
      titulo: d ? "Editar dossie" : etapa === "colar" ? "Novo resumo de reuniao" : "Conferir dossie",
      subtitulo: etapa === "colar"
        ? "Cole o resumo e o Watson classifica empresa, participantes e temas."
        : "Confira a classificacao. E ela que o Watson usa para achar a resposta depois.",
      corpo: etapa === "colar" ? corpoColar : corpoConferir,
      rodape: etapa === "colar"
        ? `<button class="btn" id="do-org">${ICO.spark} Organizar com o Watson</button><button class="btn bare" id="do-manual">Preencher manualmente</button>`
        : `<button class="btn" id="do-salvar">${d ? "Salvar alteracoes" : "Guardar na base"}</button>${d ? "" : '<button class="btn bare" id="do-voltar">Voltar ao texto</button>'}`,
      aoMontar(host) {
        if (etapa === "colar") {
          $("#do-manual", host).addEventListener("click", () => {
            bruto = $("#do-bruto", host).value;
            campos.resumo = campos.resumo || bruto.trim();
            etapa = "conferir"; desenhar();
          });
          $("#do-org", host).addEventListener("click", async () => {
            bruto = $("#do-bruto", host).value.trim();
            if (bruto.length < 30) return erroPainel(host, "Cole o resumo da reuniao antes de continuar.");
            if (!S.sample) { campos.resumo = bruto; etapa = "conferir"; return desenhar(); }

            const botao = $("#do-org", host);
            botao.disabled = true;
            botao.innerHTML = '<span class="spin"></span> Organizando';
            try {
              const r = await S.sample.json(
                `Organize este resumo de reuniao para a base de conhecimento de um grupo empresarial brasileiro do setor aeroportuario. Devolva SOMENTE um objeto JSON.

Chaves: titulo (curto e especifico), empresa (exatamente um de: industria, engenharia, administracao, software, grupo, externo), data (AAAA-MM-DD, omita se o texto nao trouxer), participantes (lista de nomes), temas (de tres a seis, minusculos, uma ou duas palavras cada), resumo (objetivo, do que foi tratado), decisoes (uma por linha, string), acoes (responsavel, o que fazer e prazo, uma por linha, string).

O que cada empresa significa: industria = equipamentos de sinalizacao de pista; engenharia = engenharia aeroportuaria; administracao = administracao de aeroportos; software = tecnologia de gestao aeroportuaria; grupo = holding e assuntos transversais; externo = parceiros, clientes e fornecedores.

Trabalhe apenas com o que esta no texto. Nao invente participantes, decisoes, prazos nem numeros. Escreva em portugues do Brasil.

Resumo:
${bruto.slice(0, 20000)}`,
                { cache: false },
              );
              if (r && typeof r === "object") {
                campos.titulo = r.titulo || "";
                if (EMPRESAS.some((e) => e.id === r.empresa)) campos.empresa = r.empresa;
                if (typeof r.data === "string" && DATA_OK.test(r.data)) campos.data = r.data;
                campos.participantes = Array.isArray(r.participantes) ? r.participantes.join(", ") : "";
                campos.temas = Array.isArray(r.temas) ? r.temas.join(", ") : "";
                campos.resumo = r.resumo || bruto;
                campos.decisoes = typeof r.decisoes === "string" ? r.decisoes : "";
                campos.acoes = typeof r.acoes === "string" ? r.acoes : "";
              }
              etapa = "conferir"; desenhar();
            } catch (e) {
              campos.resumo = campos.resumo || bruto;
              etapa = "conferir"; desenhar();
              erroPainel($("#panel-host"), e && e.code === "not_granted"
                ? "Voce recusou o acesso ao Claude. Preencha os campos na mao."
                : "A organizacao automatica falhou. Preencha os campos manualmente.");
            }
          });
        } else {
          ativarGrupos(host);
          $("#do-salvar", host).addEventListener("click", async () => {
            const titulo = $("#do-titulo", host).value.trim();
            const resumo = $("#do-resumo", host).value.trim();
            const data = $("#do-data", host).value.trim();
            if (titulo.length < 3) return erroPainel(host, "Escreva um titulo para o dossie.");
            if (resumo.length < 10) return erroPainel(host, "O resumo esta muito curto.");
            if (!DATA_OK.test(data)) return erroPainel(host, "Informe a data no formato AAAA-MM-DD.");

            const lista = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
            await salvar("dossies", d ? d.id : novoId(), {
              titulo, data,
              empresa: lerGrupo(host, "emp") || "grupo",
              participantes: lista($("#do-part", host).value),
              temas: lista($("#do-temas", host).value.toLowerCase()),
              resumo,
              decisoes: $("#do-dec", host).value.trim(),
              acoes: $("#do-acoes", host).value.trim(),
              textoBruto: bruto ? bruto.slice(0, 20000) : "",
            });
            fecharPainel();
            render();
          });
          const voltar = $("#do-voltar", host);
          if (voltar) voltar.addEventListener("click", () => { etapa = "colar"; desenhar(); });
        }
      },
    });
  }
  desenhar();
}

function painelDetalheDossie(d) {
  const bloco = (titulo, texto) => texto ? `<div style="margin-bottom:20px"><div class="eyebrow">${esc(titulo)}</div><p class="small" style="margin:0;white-space:pre-wrap;line-height:1.6">${esc(texto)}</p></div>` : "";
  abrirPainel({
    titulo: d.titulo,
    subtitulo: `${empresaCurto(d.empresa)} · ${dataLonga(doDia(d.data))}`,
    corpo: `
      ${(d.participantes || []).length ? bloco("Participantes", (d.participantes || []).join(", ")) : ""}
      ${bloco("Resumo", d.resumo)}
      ${bloco("Decisoes", d.decisoes)}
      ${bloco("Acoes combinadas", d.acoes)}
      ${(d.temas || []).length ? `<div style="margin-bottom:20px"><div class="eyebrow">Temas</div><div class="topics">${(d.temas || []).map((t) => `<span class="topic">${esc(t)}</span>`).join("")}</div></div>` : ""}
      ${d.textoBruto ? `<div><div class="eyebrow">Texto original</div><p class="tiny mute" style="margin:0;white-space:pre-wrap;line-height:1.55">${esc(d.textoBruto)}</p></div>` : ""}`,
    rodape: `<button class="btn ghost" id="ed-dossie">Editar dossie</button><button class="btn danger" id="ex-dossie">Excluir da base</button>`,
    aoMontar(host) {
      $("#ed-dossie", host).addEventListener("click", () => painelDossie(d));
      $("#ex-dossie", host).addEventListener("click", () => confirmarExclusao(`"${d.titulo}" sai da base de conhecimento.`, async () => {
        await remover("dossies", d.id); fecharPainel(); render();
      }));
    },
  });
}
</script>
<script>
"use strict";

/* ---------- contexto enviado ao Watson ----------
   Nem tudo vai junto de toda pergunta: a agenda proxima, a saude recente
   e os dossies que casam com o que foi perguntado. Cada resposta mostra
   embaixo o que foi consultado. */
function montarContexto(pergunta) {
  const agora = new Date();
  const blocos = [];
  const consultado = [];

  const ocs = ocorrenciasEntre(S.eventos, somaDias(agora, -2), somaDias(agora, 14));
  if (ocs.length) {
    blocos.push("AGENDA, DE DOIS DIAS ATRAS ATE DUAS SEMANAS A FRENTE\n" + ocs.map((o) => {
      const e = o.evento;
      return `- ${dataLonga(o.inicio)}, ${e.diaInteiro ? "dia inteiro" : hora(o.inicio)}: ${e.titulo}${e.empresa ? ` [${empresaCurto(e.empresa)}]` : ""}${e.local ? `, em ${e.local}` : ""}${e.descricao ? ` - ${e.descricao}` : ""}`;
    }).join("\n"));
    consultado.push("agenda");
  }

  const recentes = S.saude.slice(-21);
  if (recentes.length) {
    const linhas = recentes.map((d) => {
      const p = [];
      if (ehNum(d.recuperacao)) p.push(`recuperacao ${Math.round(d.recuperacao)}%`);
      if (ehNum(d.sono)) p.push(`sono ${d.sono.toFixed(1)}h`);
      if (ehNum(d.vfc)) p.push(`VFC ${Math.round(d.vfc)}ms`);
      if (ehNum(d.fcRepouso)) p.push(`FC repouso ${Math.round(d.fcRepouso)}bpm`);
      if (ehNum(d.esforco)) p.push(`esforco ${d.esforco.toFixed(1)}`);
      return `- ${d.data}: ${p.join(", ") || "sem dados"}`;
    });
    const alertas = avaliarSaude(recentes);
    blocos.push("INDICADORES DE SAUDE DOS ULTIMOS DIAS\n" + linhas.join("\n") +
      (alertas.length ? "\n\nSINAIS DETECTADOS PELO APLICATIVO\n" + alertas.map((a) => `- [${a.tom || "bom"}] ${a.titulo}: ${a.texto}`).join("\n") : ""));
    consultado.push("saude");
  }

  const ocs90 = ocorrenciasEntre(S.eventos, somaDias(agora, -90), agora);
  const corr = correlacaoCarga(ocs90, S.saude);
  const imp = impactoReunioes(ocs90, S.saude);
  if (corr || imp.length) {
    const partes = [];
    if (corr) partes.push(`Apos dias com mais de ${corr.limiar.toFixed(1)}h de reuniao, a recuperacao media no dia seguinte foi de ${Math.round(corr.pesado)}%. Apos os dias mais leves, foi de ${Math.round(corr.leve)}%. Base de ${corr.dias} dias.`);
    if (imp.length) partes.push("CUSTO ESTIMADO POR REUNIAO RECORRENTE\n" + imp.slice(0, 5).map((i) => `- ${i.titulo}: recuperacao no dia seguinte ${i.delta > 0 ? "+" : ""}${i.delta.toFixed(1)} pontos contra a media, em ${i.ocorrencias} ocorrencias`).join("\n"));
    blocos.push("ANALISE CRUZADA CALCULADA PELO APLICATIVO (indicio estatistico, nao prova de causa)\n" + partes.join("\n\n"));
    consultado.push("cruzamento");
  }

  const anivs = aniversariosProximos().filter((a) => a.faltam <= 45);
  if (anivs.length) {
    blocos.push("ANIVERSARIOS PROXIMOS\n" + anivs.map((a) => `- ${a.b.nome}${a.b.relacao ? ` (${a.b.relacao})` : ""}: ${dataLonga(a.prox)}, em ${a.faltam} dias${a.idade ? `, completando ${a.idade} anos` : ""}`).join("\n"));
    consultado.push("aniversarios");
  }

  const achados = S.busca || pergunta ? buscarDossies(pergunta).slice(0, 6) : [];
  if (achados.length) {
    blocos.push("REGISTROS DA BASE CORPORATIVA RELACIONADOS A PERGUNTA\n\n" + achados.map((d) => [
      `### ${d.titulo}`,
      `Empresa: ${empresaCurto(d.empresa)} | Data: ${d.data}`,
      (d.participantes || []).length ? `Participantes: ${(d.participantes || []).join(", ")}` : "",
      (d.temas || []).length ? `Temas: ${(d.temas || []).join(", ")}` : "",
      `Resumo: ${d.resumo}`,
      d.decisoes ? `Decisoes: ${d.decisoes}` : "",
      d.acoes ? `Acoes: ${d.acoes}` : "",
    ].filter(Boolean).join("\n")).join("\n\n"));
    consultado.push(`${achados.length} ${achados.length > 1 ? "dossies" : "dossie"}`);
  }

  const agoraTxt = `Hoje e ${diaCompleto(new Date())} de ${new Date().getFullYear()}.`;
  const texto = blocos.length ? `${agoraTxt}\n\nCONTEXTO DA BASE DO USUARIO\n\n${blocos.join("\n\n")}` : agoraTxt;
  return { texto: texto.slice(0, 48000), consultado };
}

const INSTRUCOES = `Voce e o Watson, assistente pessoal e corporativo de um executivo brasileiro que preside um grupo empresarial do setor aeroportuario. O grupo reune quatro empresas: uma industria de equipamentos de sinalizacao de pista, uma empresa de engenharia aeroportuaria, uma administradora de aeroportos e uma empresa de tecnologia de software de gestao aeroportuaria.

COMO VOCE FALA
Portugues do Brasil, sempre. Sobrio, preciso e cordial, no registro de um secretario particular ingles experiente: nunca bajulador, nunca prolixo. Frases curtas, uma ideia por frase. Va direto a resposta antes de qualquer contexto.

O QUE VOCE SABE
Responda a partir do contexto que acompanha a pergunta, vindo da base do proprio usuario. Nunca invente um numero, uma data, um nome ou uma decisao. Se o contexto nao cobre a pergunta, diga o que falta e qual registro ele precisa adicionar.

COMO VOCE PENSA
Nao repita apenas o que esta no contexto. Cruze informacoes, aponte padroes, contradicoes e riscos que ele talvez nao tenha notado. Quando duas reunioes decidiram coisas incompativeis, diga. Quando os indicadores de saude contam uma historia que a agenda explica, conecte as duas coisas.

SOBRE SAUDE
Voce le indicadores, nao diagnostica. Pode sinalizar padroes preocupantes e recomendar procurar um medico. Nunca afirme uma doenca nem sugira medicamento.

FORMATO
Texto corrido curto. Lista apenas para itens realmente paralelos. Nada de titulos, markdown pesado ou emoji. Ao citar um dado, diga de onde veio, por exemplo "na reuniao de 12 de marco" ou "no seu registro de terca".`;

const SUGESTOES = ["O que eu tenho hoje?", "Como esta minha semana de saude?", "Quais reunioes mais me desgastam?", "O que ficou decidido na industria?"];

function painelConversa() {
  let enviando = false;

  function corpoConversa() {
    if (!S.conversa.length) {
      return `<div class="empty" style="padding-top:18px">
        <div class="mark">${ICO.chat}</div>
        <h3>As suas de sempre, senhor?</h3>
        <p>O Watson responde a partir do que existe na sua base: agenda, saude, aniversarios e dossies. Quanto mais voce registra, mais ele enxerga.</p>
      </div>
      <div class="suggest">${SUGESTOES.map((s) => `<button data-sugestao="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
    }
    return `<div class="chat-log">${S.conversa.map((m) => {
      const meu = m.papel === "eu";
      return `<div class="turn ${meu ? "mine" : "theirs"}">
        ${meu ? "" : `<div class="avatar">${ICO.glass}</div>`}
        <div class="bubble">${esc(m.texto)}${m.consultado ? `<span class="src">consultou: ${esc(m.consultado)}</span>` : ""}</div>
      </div>`;
    }).join("")}
    ${enviando ? `<div class="turn theirs"><div class="avatar">${ICO.glass}</div><div class="thinking"><span class="spin"></span> O Watson esta pensando</div></div>` : ""}
    </div>`;
  }

  function desenhar(preencher = "") {
    abrirPainel({
      titulo: "Watson",
      subtitulo: enviando ? "Consultando a sua base..." : "Pergunte sobre qualquer coisa da sua base",
      corpo: corpoConversa(),
      rodape: `
        <p class="err" id="erro-painel" hidden></p>
        <div class="composer" style="border:none;padding:0;margin:0">
          <textarea id="chat-txt" placeholder="Pergunte ao Watson" rows="1">${esc(preencher)}</textarea>
          <button id="chat-env" aria-label="Enviar" ${enviando ? "disabled" : ""}>${ICO.up}</button>
        </div>
        ${S.conversa.length ? '<button class="btn bare" id="chat-limpar">Apagar esta conversa</button>' : ""}`,
      aoMontar(host) {
        const log = $(".panel-body", host);
        log.scrollTop = log.scrollHeight;

        const txt = $("#chat-txt", host);
        const crescer = () => { txt.style.height = "auto"; txt.style.height = Math.min(130, txt.scrollHeight) + "px"; };
        txt.addEventListener("input", crescer);
        crescer();
        if (preencher) txt.focus();

        liga(host, "[data-sugestao]", "click", (e) => { txt.value = e.currentTarget.dataset.sugestao; crescer(); txt.focus(); });

        const limpar = $("#chat-limpar", host);
        if (limpar) limpar.addEventListener("click", async () => {
          const ids = S.conversa.map((m) => m.id);
          S.conversa = [];
          if (S.db) for (const id of ids) { try { await S.db.doc("conversa/" + id).delete(); } catch (err) { /* segue */ } }
          desenhar();
        });

        const enviar = async () => {
          const pergunta = txt.value.trim();
          if (!pergunta || enviando) return;
          if (!S.sample) return erroPainel(host, "A conversa com o Watson nao esta disponivel nesta visualizacao.");

          const { texto: contexto, consultado } = montarContexto(pergunta);
          const minha = { id: novoId(), papel: "eu", texto: pergunta, consultado: consultado.join(", "), criadoEm: new Date().toISOString() };
          S.conversa.push(minha);
          if (S.db) { try { await S.db.doc("conversa/" + minha.id).set(minha); } catch (err) { /* segue em memoria */ } }

          enviando = true;
          desenhar();

          // O historico recente vai junto para a conversa ter fio; as
          // instrucoes sao sempre o primeiro turno e nunca caem fora.
          const anteriores = S.conversa.slice(-9, -1).map((m) => ({ role: m.papel === "eu" ? "user" : "assistant", content: m.texto }));
          const turnos = [{ role: "user", content: INSTRUCOES }]
            .concat(anteriores)
            .concat([{ role: "user", content: `${contexto}\n\n---\n\nPergunta: ${pergunta}` }]);

          try {
            const r = await S.sample(turnos, { cache: false });
            const dele = { id: novoId(), papel: "watson", texto: r.text, consultado: "", criadoEm: new Date().toISOString() };
            S.conversa.push(dele);
            if (S.db) { try { await S.db.doc("conversa/" + dele.id).set(dele); } catch (err) { /* segue */ } }
            enviando = false;
            desenhar();
          } catch (e) {
            enviando = false;
            desenhar();
            const cod = e && e.code;
            const msg = cod === "not_granted" ? "Voce recusou o acesso ao Claude. Toque novamente para autorizar."
              : cod === "rate_limited" ? "Muitas perguntas em pouco tempo. Espere um instante e tente de novo."
              : cod === "prompt_too_large" ? "Sua base ficou grande demais para uma pergunta so. Seja mais especifico."
              : "Nao consegui falar com o Watson agora. Tente novamente.";
            erroPainel($("#panel-host"), msg);
          }
        };

        $("#chat-env", host).addEventListener("click", enviar);
        txt.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
        });
      },
    });
  }
  desenhar();
}

/* ---------- exportacao ---------- */
async function exportarDados() {
  if (!S.downloads) { S.aviso = "A exportacao nao esta disponivel nesta visualizacao."; return render(); }
  const pacote = {
    formato: "watson-backup", versao: 1, geradoEm: new Date().toISOString(),
    eventos: S.eventos.filter((x) => !x.demo),
    aniversarios: S.aniversarios.filter((x) => !x.demo),
    saude: S.saude.filter((x) => !x.demo),
    dossies: S.dossies.filter((x) => !x.demo),
  };
  try {
    await S.downloads.save({
      filename: `watson-${new Date().toISOString().slice(0, 10)}.json`,
      data: JSON.stringify(pacote, null, 2),
    });
    S.aviso = null;
  } catch (e) {
    if (e && e.code === "declined") return;
    S.aviso = "Nao consegui gerar o arquivo agora.";
    render();
  }
}
</script>
<script>
"use strict";

/* ---------- barra inferior ----------
   O Watson ocupa o centro, elevado e em latao: e o destino que se procura
   primeiro. Os outros quatro se distribuem ao redor. */
const ABAS = [
  { id: "agenda", rotulo: "AGENDA", ico: ICO.cal },
  { id: "saude", rotulo: "SAUDE", ico: ICO.pulse },
  { id: "watson", rotulo: "WATSON", ico: ICO.home, centro: true },
  { id: "dossies", rotulo: "DOSSIES", ico: ICO.books },
  { id: "ajustes", rotulo: "AJUSTES", ico: ICO.gear },
];

function renderBarra() {
  $("#bar").innerHTML = ABAS.map((a) => {
    const ativo = S.aba === a.id;
    return `<button data-aba="${a.id}" aria-current="${ativo}" ${a.centro ? 'class="home-slot"' : ""}>
      ${a.centro ? `<span class="home-mark">${a.ico}</span>` : a.ico}
      <span>${a.rotulo}</span>
    </button>`;
  }).join("");
}

/* ---------- render ---------- */
function render() {
  const view = $("#view");
  const antes = window.scrollY;
  view.innerHTML = S.aba === "watson" ? viewWatson()
    : S.aba === "agenda" ? viewAgenda()
    : S.aba === "saude" ? viewSaude()
    : S.aba === "dossies" ? viewDossies()
    : viewAjustes();
  renderBarra();
  if (S.manterRolagem) { window.scrollTo(0, antes); S.manterRolagem = false; }
}

function irPara(aba) {
  if (S.aba === aba) return;
  S.aba = aba;
  S.busca = "";
  window.scrollTo(0, 0);
  render();
}

/* ---------- eventos ----------
   Um unico ouvinte na raiz: a pagina se redesenha inteira a cada mudanca,
   entao ouvir no documento evita religar tudo a cada render. */
document.addEventListener("click", (e) => {
  const alvo = (sel) => e.target.closest(sel);

  const aba = alvo("[data-aba]");
  if (aba) return irPara(aba.dataset.aba);

  const ir = alvo("[data-ir]");
  if (ir) return irPara(ir.dataset.ir);

  if (alvo("#abrir-conversa")) return painelConversa();

  const mes = alvo("[data-mes]");
  if (mes) {
    const passo = Number(mes.dataset.mes);
    if (passo === 0) { S.mesRef = new Date(new Date().getFullYear(), new Date().getMonth(), 1); S.diaSel = new Date(); }
    else S.mesRef = new Date(S.mesRef.getFullYear(), S.mesRef.getMonth() + passo, 1);
    S.manterRolagem = true;
    return render();
  }

  const dia = alvo("[data-dia]");
  if (dia) { S.diaSel = doDia(dia.dataset.dia); S.manterRolagem = true; return render(); }

  const abaAg = alvo("[data-aba-agenda]");
  if (abaAg) { S.abaAgenda = abaAg.dataset.abaAgenda; return render(); }

  const per = alvo("[data-periodo]");
  if (per) { S.periodoSaude = per.dataset.periodo; S.manterRolagem = true; return render(); }

  const emp = alvo("[data-empresa]");
  if (emp) { S.filtroEmpresa = emp.dataset.empresa; S.manterRolagem = true; return render(); }

  if (alvo("[data-limpar-busca]")) { S.busca = ""; return render(); }

  if (alvo("[data-novo-evento]")) return painelEvento(null);
  if (alvo("[data-novo-aniv]")) return painelAniversario(null);
  if (alvo("[data-novo-relatorio]")) return painelRelatorio(null);
  if (alvo("[data-novo-dossie]")) return painelDossie(null);
  if (alvo("[data-exportar]")) return exportarDados();

  const abrirEv = alvo("[data-abrir-evento]");
  if (abrirEv) {
    const ev = S.eventos.find((x) => x.id === abrirEv.dataset.abrirEvento);
    if (ev && ev.demo) { S.aviso = "Este e um evento de exemplo. Crie o seu com o botao de adicionar."; return render(); }
    if (ev) return painelEvento(ev);
  }

  const abrirAn = alvo("[data-abrir-aniv]");
  if (abrirAn) {
    const an = S.aniversarios.find((x) => x.id === abrirAn.dataset.abrirAniv);
    if (an && an.demo) { S.aviso = "Este e um aniversario de exemplo."; return render(); }
    if (an) return painelAniversario(an);
  }

  const abrirDo = alvo("[data-abrir-dossie]");
  if (abrirDo) {
    const d = S.dossies.find((x) => x.id === abrirDo.dataset.abrirDossie);
    if (d) return painelDetalheDossie(d);
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "campo-busca") {
    S.busca = e.target.value;
    const foco = document.activeElement === e.target;
    const pos = e.target.selectionStart;
    S.manterRolagem = true;
    render();
    if (foco) {
      const novo = $("#campo-busca");
      if (novo) { novo.focus(); try { novo.setSelectionRange(pos, pos); } catch (err) { /* navegador antigo */ } }
    }
  }
});

/* ---------- inicio ----------
   A pagina desenha com o que tem e liga as capacidades quando elas
   respondem. Se nenhuma responder, o Watson ainda abre e mostra o
   exemplo, so nao guarda nada. */
async function iniciar() {
  render();

  const [db, sample, downloads] = await Promise.all([
    window.claude && window.claude.use ? window.claude.use("db").catch(() => null) : null,
    window.claude && window.claude.use ? window.claude.use("sample").catch(() => null) : null,
    window.claude && window.claude.use ? window.claude.use("downloads").catch(() => null) : null,
  ]);

  S.db = db;
  S.sample = sample;
  S.downloads = downloads;

  await carregarTudo();
  S.pronto = true;
  render();
}

iniciar();
</script>
